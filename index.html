<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أفكار الابتكار التشغيلي والتسويقي - التنين الذكي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.2);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --success-color: #22c55e;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--accent-color), #3b82f6);
            background-clip: text; /* السطر الإضافي الذي يحل تحذير VS Code */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        /* Progress Bar */
        .progress-container {
            max-width: 800px;
            margin: 30px auto;
            background: var(--card-bg);
            border-radius: 50px;
            height: 25px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--success-color), #4ade80);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-right: 15px;
            font-weight: bold;
            color: #052e16;
            font-size: 0.9rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border-color);
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-color), #3b82f6);
            opacity: 0.8;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }

        /* Checkbox Style */
        .checkbox-wrapper {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .custom-checkbox {
            display: block;
            width: 28px;
            height: 28px;
            border: 2px solid var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            background-color: transparent;
        }

        .custom-checkbox:hover {
            border-color: var(--success-color);
        }

        input[type="checkbox"] {
            display: none;
        }

        input[type="checkbox"]:checked + .custom-checkbox {
            background-color: var(--success-color);
            border-color: var(--success-color);
        }

        input[type="checkbox"]:checked + .custom-checkbox::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #052e16;
            font-size: 20px;
            font-weight: 900;
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0); }
            80% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .icon-box svg {
            width: 35px;
            height: 35px;
            stroke: var(--accent-color);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Implemented State */
        .card.implemented {
            opacity: 0.6;
            background: #16202e;
        }

        .card.implemented::before {
            background: var(--success-color);
        }

        .card.implemented h2 {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .card.implemented .icon-box svg {
            stroke: var(--success-color);
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>خطة الابتكار في التشغيل والمبيعات</h1>
        <p>أفكار ذكاء اصطناعي وتسويق مبتكرة - اضغط على المربع لتحديد الفكرة كـ "تم التنفيذ"</p>
    </header>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar">0% مكتمل</div>
    </div>

    <div class="grid-container" id="ideasGrid">
        <!-- Cards will be injected here by JS -->
    </div>

    <footer>
        تصميم تفاعلي لتبسيط الأفكار التشغيلية والتسويقية &copy; 2024
    </footer>

    <script>
        // Data Array for Ideas
        const ideas = [
            {
                title: "نظام الموظفين الرقميين (AI Agents)",
                desc: "وكلاء ذكاء اصطناعي يردون على العملاء ويجهزون الاقتراحات، في انتظار اعتمادك بضغطة زر (Human-in-the-Loop).",
                icon: `<path d="M12 8V4H8" /><rect width="16" height="12" x="4" y="8" rx="2" /><path d="M2 14h2M20 14h2M15 13v2M9 13v2" />`
            },
            {
                title: "تطوير أدوات داخلية (Verdent AI)",
                desc: "بناء منصات برمجية داخلية تساعد في تنظيم العمل وتخطيط المشاريع كشريك برمجي يحلل ويكتب الأكواد.",
                icon: `<polyline points="16 18 22 12 16 6" /><polyline points="8 6 2 12 8 18" />`
            },
            {
                title: "صياغة حملات CO-STAR",
                desc: "استخدام إطار عمل CO-STAR لكتابة نصوص إعلانية تضمن أقصى درجات التأثير والاستجابة من مالكي السيارات.",
                icon: `<path d="M3 11l18-5v12L3 14v-3z" /><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6" />`
            },
            {
                title: "التسعير الديناميكي الاستباقي",
                desc: "تحليل أسعار المنافسين آلياً واقتراح تعديل فوري لأسعارك للحفاظ على هامش الربح والبقاء في الصدارة.",
                icon: `<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" /><line x1="7" y1="7" x2="7.01" y2="7" />`
            },
            {
                title: "خريطة الطلب الحرارية (CRM)",
                desc: "استغلال بيانات العملاء لإطلاق حملات صيانة استباقية مخصصة حسب الموقع والموسم (مثل الإضاءة قبل الشتاء).",
                icon: `<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" />`
            },
            {
                title: "مصنع المحتوى التلقائي",
                desc: "تحويل نصوص فيديوهات المنافسين إلى سيناريوهات وأفكار قصيرة (Reels/TikTok) متفوقة ومصاغة باللهجة المحلية.",
                icon: `<polygon points="23 7 16 12 23 17 23 7" /><rect x="1" y="5" width="15" height="14" rx="2" ry="2" />`
            },
            {
                title: "برنامج صناعة المحتوى بالمكافآت",
                desc: "فتح باب المشاركة لصناع المحتوى لعمل مراجعات للمنتجات مقابل حوافز، نقاط ولاء، أو خصومات.",
                icon: `<circle cx="12" cy="8" r="7" /><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88" />`
            },
            {
                title: "محتوى الرسوم البسيطة (Stick Figure)",
                desc: "إنتاج فيديوهات قصيرة برسومات بسيطة توضح كيف تحل إكسسواراتنا مشاكل السائقين اليومية لتحقيق انتشار سريع.",
                icon: `<circle cx="12" cy="5" r="3" /><line x1="12" y1="8" x2="12" y2="16" /><line x1="8" y1="12" x2="16" y2="12" /><line x1="12" y1="16" x2="8" y2="22" /><line x1="12" y1="16" x2="16" y2="22" />`
            },
            {
                title: "استطلاعات الرأي المثيرة للجدل",
                desc: "توليد فيديوهات جدلية ساخنة (LED ضد Xenon) لتصدر الترندات ورفع نسبة المشاركات والتعليقات.",
                icon: `<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /><line x1="9" y1="9" x2="9" y2="13" /><line x1="12" y1="9" x2="12" y2="15" /><line x1="15" y1="9" x2="15" y2="13" />`
            },
            {
                title: "لوحة عروض أسعار تفاعلية",
                desc: "أداة لموظف المبيعات تولد صفحة عرض سعر ديناميكية (صور، فيديوهات، أسعار) بضغطة زر بمجرد إدخال نوع السيارة.",
                icon: `<rect x="2" y="3" width="20" height="14" rx="2" ry="2" /><line x1="8" y1="21" x2="16" y2="21" /><line x1="12" y1="17" x2="12" y2="21" /><path d="M12 7l2 2-2 2-2-2 2-2" />`
            }
        ];

        const grid = document.getElementById('ideasGrid');
        const progressBar = document.getElementById('progressBar');

        // Generate Cards
        ideas.forEach((idea, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="idea-${index}">
                    <label for="idea-${index}" class="custom-checkbox"></label>
                </div>
                <div class="card-content">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24">${idea.icon}</svg>
                    </div>
                    <h2>${idea.title}</h2>
                    <p>${idea.desc}</p>
                </div>
            `;
            grid.appendChild(card);

            // Add Event Listener
            const checkbox = card.querySelector('input[type="checkbox"]');
            checkbox.addEventListener('change', function() {
                if (this.checked) {
                    card.classList.add('implemented');
                } else {
                    card.classList.remove('implemented');
                }
                updateProgress();
            });
        });

        // Update Progress Function
        function updateProgress() {
            const total = ideas.length;
            const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
            const percentage = Math.round((checked / total) * 100);
            progressBar.style.width = `${percentage}%`;
            progressBar.innerText = `${percentage}% مكتمل (${checked}/${total})`;
        }
    </script>
    <script src="auth.js"></script>
</body>
</html>
