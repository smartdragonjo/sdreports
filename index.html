    function fmtDate(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        var m = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
        return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();
    }

    /* ===== دالة تحويل Markdown إلى HTML ===== */
    function md2html(md) {
        if (!md || md.trim() === '' || md.trim() === '*') return '<p class="na-msg">لا يتوفر</p>';
        var h = md;
        h = h.replace(/^###\s*.+$/gm, '');
        h = h.replace(/^---+$/gm, '');
        h = h.replace(/^\*\*\[(.+?)\]\(.*?\)\*\*:?\s*(.*)$/gm, '<li><strong>$1:</strong> $2</li>');
        h = h.replace(/^\*\*\*(.+?)\*\*\*:?\s*(.*)$/gm, '<li><strong>$1:</strong> $2</li>');
        h = h.replace(/^\*\s*\*\*(.+?)\*\*:?\s*(.*)$/gm, '<li><strong>$1:</strong> $2</li>');
        h = h.replace(/^\*\s+(.+)$/gm, '<li>$1</li>');
        h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        h = h.replace(/((?:<li>[\s\S]*?<\/li>\s*)+)/g, '<ul>$1</ul>');
        h = h.replace(/<\/ul>\s*<ul>/g, '');
        var lines = h.split('\n');
        var out = [];
        for (var i = 0; i < lines.length; i++) {
            var ln = lines[i].trim();
            if (ln === '') continue;
            if (ln.indexOf('<') === 0) { out.push(ln); }
            else { out.push('<p>' + ln + '</p>'); }
        }
        return out.join('\n');
    }

        tr: `"عرض زي هيك من داخل محلات الربيع ضروري جداً لسيارتك، وتزورنا على هو جهاز الإنذار. هذا هو جهاز الإنذار من شركة PLC، من أفضل أجهزة الإنذار اللي ممكن تركبها على سيارتك. نزل سعره من 30 دينار لأقل من 15 دينار، اسألني عن سعره بالتعليقات لأجاوبك بأسرع وقت. موجود لجميع المحافظات، اربد وعمان وسلام."\n---\n### الملخص الاستراتيجي\n* **خلق حالة من الضرورة (Urgency):** "ضروري جداً لسيارتك" لربط أمان السيارة بالمنتج.\n* **استراتيجية التسعير الجذاب (Anchoring Effect):** المقارنة السعرية (من 30 دينار إلى أقل من 15 دينار) من أقوى أساليب الإقناع.\n* **إثارة التفاعل (Engagement Hook):** طلب الاستفسار في التعليقات استراتيجي جداً لزيادة الانتشار (Reach).\n* **بناء الثقة وتحديد الهوية التجارية:** ذكر اسم المحل (الربيع) واسم الشركة المصنعة (PLC) بوضوح.\n* **نمط المحتوى:** أسلوب "التصوير المباشر باليد" (POV) يعطي طابعاً عفويًا وغير متكلف.`,

    /* ===== بناء التبويبات والإحصائيات والبطاقات ===== */
    var competitors = [];
    var compMap = {};
    reportData.forEach(function(r) {
        if (!compMap[r.c]) { compMap[r.c] = 0; competitors.push(r.c); }
        compMap[r.c]++;
    });

    /* شريط الإحصائيات */
    document.getElementById('statsBar').innerHTML =
        '<span class="stat-chip">إجمالي السجلات: <strong>' + reportData.length + '</strong></span>' +
        '<span class="stat-chip">عدد المنافسين: <strong>' + competitors.length + '</strong></span>' +
        competitors.map(function(c) { return '<span class="stat-chip">' + c + ': <strong>' + compMap[c] + '</strong></span>'; }).join('');

    /* بناء التبويبات */
    var tabsHTML = '<button class="tab-btn active" onclick="openTab(event, \'all\')">الكل (' + reportData.length + ')</button>';
    competitors.forEach(function(c) {
        tabsHTML += '<button class="tab-btn" onclick="openTab(event, \'' + c.replace(/'/g, "\\'") + '\')">' + c + ' (' + compMap[c] + ')</button>';
    });
    document.getElementById('tabsContainer').innerHTML = tabsHTML;

    /* بناء محتوى التبويبات */
    function buildCards(filter) {
        var filtered = filter === 'all' ? reportData : reportData.filter(function(r) { return r.c === filter; });
        var html = '';
        filtered.forEach(function(r, idx) {
            var summaryHTML = '';
            if (r.s && r.s.trim() !== '' && r.s.trim() !== '*' && r.s.trim() !== 'تم التلخيص مدمجاً في التفريغ.') {
                summaryHTML = '<div class="block"><h3>الملخص الاستراتيجي</h3>' + md2html(r.s) + '</div>';
            } else if (r.s && r.s.trim() === 'تم التلخيص مدمجاً في التفريغ.') {
                summaryHTML = '<div class="block"><h3>الملخص الاستراتيجي</h3><p class="merged-note">الملخص مدمج ضمن التفريغ الصوتي أعلاه</p></div>';
            }

            html += '<div class="card" data-search="' +
                (r.t + ' ' + r.c + ' ' + r.tr + ' ' + r.s).replace(/"/g, '&quot;').toLowerCase() + '">' +
                '<div class="card-header"><span class="caption">' + r.t + '</span><span class="date">' + fmtDate(r.d) + '</span></div>' +
                '<div class="card-body">' +
                    '<div class="content">' +
                        '<div class="block transcript"><h3>التفريغ الصوتي</h3>' + md2html(r.tr) + '</div>' +
                        summaryHTML +
                    '</div>' +
                    '<div class="media">' +
                        (r.i && r.i !== '*' ? '<img src="' + r.i + '" alt="صورة المنشور" loading="lazy">' : '') +
                        (r.v ? '<a href="' + r.v + '" target="_blank" rel="noopener" class="watch-btn">مشاهدة الفيديو</a>' : '') +
                    '</div>' +
                '</div>' +
            '</div>';
        });
        return html;
    }

    /* إنشاء تبويب لكل منافس */
    var container = document.getElementById('reportContainer');
    container.innerHTML = '<div class="tab-content active" id="tab-all">' + buildCards('all') + '</div>';
    competitors.forEach(function(c) {
        var id = 'tab-' + c.replace(/[^a-zA-Z0-9\u0600-\u06FF]/g, '_');
        container.innerHTML += '<div class="tab-content" id="' + id + '">' + buildCards(c) + '</div>';
    });

    /* ===== وظائف التبويب والبحث ===== */
    function openTab(e, name) {
        document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
        document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
        e.currentTarget.classList.add('active');
        if (name === 'all') {
            document.getElementById('tab-all').classList.add('active');
        } else {
            var id = 'tab-' + name.replace(/[^a-zA-Z0-9\u0600-\u06FF]/g, '_');
            document.getElementById(id).classList.add('active');
        }
        searchReport();
    }

    function searchReport() {
        var q = document.getElementById('searchInput').value.toLowerCase().trim();
        var activeTab = document.querySelector('.tab-content.active');
        var cards = activeTab ? activeTab.querySelectorAll('.card') : [];
        var visible = 0;
        cards.forEach(function(card) {
            var text = card.getAttribute('data-search');
            if (!q || text.indexOf(q) !== -1) {
                card.style.display = '';
                visible++;
            } else {
                card.style.display = 'none';
            }
        });
        document.getElementById('noResults').style.display = (visible === 0) ? 'block' : 'none';
    }
    </script>
