            { c: "Double M For Cars Accessories", d: "24 يوليو 2026", t: "‏خصم على فرش (Gb)لنعاية يوم السبت فرش تركي...", v: "https://www.facebook.com/reel/1035070422765813/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t51.82787-10/753205944_18360243835215801_6270205982114854944_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=101&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=YVfzekUK75gQ7kNvwGTzLQE&_nc_oc=Adqk2f44qdNl3LMHB4L4MKFQFYSVZyEfw5d0Zk3BVu4PbgFahlOFJ1xqOO6zvLL27XDyUZzETd1eisbLJ4xkxNLk&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=LaZzH73DKSsbbYSYLEDN5g&_nc_ss=7b289&oh=00_AQAes7UEDZr33XeoI5g-Tku2c4UmggKsNEI7jAmtcoym2g&oe=6A69499F", tr: "النص المكتوب: لما عرفت إنو في خصم 30% على فرش أل (GB). الصوت: موسيقى إيقاعية (ريمكس Samba) تتماشى مع حركة الكاميرا وزوايا عرض الفرش.", s: "<ul><li><strong>الجاذبية البصرية:</strong> التركيز على جودة المنتج وتصميمه الأنيق.</li><li><strong>استراتيجية العرض:</strong> 'خصم 30%' كخطاف أساسي لجذب العميل.</li><li><strong>العناصر الترفيهية:</strong> ملصق القطة الراقصة لكسر الجمود وزيادة الانتشار.</li></ul>" },
            { c: "الربيع لكهرباء وزينة السيارات", d: "24 يوليو 2026", t: "متوفر لجميع موديلات السيارات 🚗 موديلات وألوان ونقشات...", v: "https://www.facebook.com/reel/1376836884395865/", i: "https://scontent-lhr6-1.xx.fbcdn.net/v/t15.5256-10/755494070_1019999757610301_5840612121675807140_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=102&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=4Fe5nkvsYssQ7kNvwH8AXa2&_nc_oc=Ado4slcQs-4xVTEjXfx_qODpYA_SF7C1O_v6lzleiq9OOjI1-Cvd7O5zOa0MWVH8omg&_nc_zt=23&_nc_ht=scontent-lhr6-1.xx&_nc_gid=TtUJHaQxY1nyV4t1tpzlbA&_nc_ss=7b289&oh=00_AQAvwiKHeCFOcsj8kaHtpLTaOmxrpGwmiJTDtcbcjheeXg&oe=6A6923B0", tr: "اليوم رجعنا لكم بفرش الـ 10D الجلد بالكامل... متوفر منه جميع الألوان: أسود، بيج، رمادي... ومعاه طارة حَبك من النوع الثقيل... كان ينباع بـ 60 و 65 دينار... اليوم عليه عرض، اسألني عن سعره بالتعليقات، والعرض متوفر لنهاية الأسبوع... بنستناكم بجميع الأفرع من 9 الصبح لغاية 2 بالليل... يا بتلحق يا بتروح عليك.", s: "<ul><li><strong>خلق شعور بالإلحاح (Urgency):</strong> ربط العرض بكلمات مثل 'لحق أو بتروح عليك' ونهاية الأسبوع.</li><li><strong>بناء الثقة (Authority):</strong> استخدام لغة خبير (النوع الثقيل، الجلد بالكامل) والمقارنة السعرية.</li><li><strong>استراتيجية التفاعل:</strong> إخفاء السعر وطلبه في التعليقات لرفع خوارزميات الفيديو.</li><li><strong>استهداف النطاق الجغرافي:</strong> تحديد الفروع (عمان وإربد) ومواعيد العمل.</li></ul>" },
            { c: "Double M For Cars Accessories", d: "24 يوليو 2026", t: "غطاء تابلو كنتاره و قماش متوفر في معارض الدبل ام...", v: "https://www.facebook.com/reel/2045312383038408/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t51.82787-10/755743304_18360285430215801_4750426222300759630_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=107&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=3hiYED1GseYQ7kNvwHqBjdg&_nc_oc=AdoALKkfkx3o_l7LjEBQHib_WIpqHtgfOYuTXck3LQn8Dgxb2XtBKcHOckF8lQt44oi50bEYpAa30Xf40nTEagW&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=LaZzH73DKSsbbYSYLEDN5g&_nc_ss=7b289&oh=00_AQDyaf_H-end3rGxGdigwLyefNe7Jn70LgcFpbbIinzRLw&oe=6A694ABE", tr: "بسم الله الرحمن الرحيم، اليوم جايبينلكم أغطية التابلو، بتيجي للأقمشة أو الكنتارا... مبطنين سيليكون مستحيل يتحركوا... متوفر لمعظم أنواع السيارات، كل اللي عليك تدخل على التعليقات تحت وتكتبلي نوع سيارتك... بنستناكم بالفروع، سلام.", s: "<ul><li><strong>تحديد القيمة التنافسية:</strong> إبراز 'ثبات المنتج' كأهم ميزة (طبقة السيليكون السفلية).</li><li><strong>استراتيجية CTA الذكية:</strong> توجيه المشاهدين لكتابة 'نوع السيارة' في التعليقات لزيادة التفاعل والوصول.</li><li><strong>تقديم الخيارات:</strong> عرض تنوع الخيارات (القماش والكنتارا) لتعدد الاختيارات.</li></ul>" },
            { c: "الربيع لكهرباء وزينة السيارات", d: "24 يوليو 2026", t: "اخيراً 😶", v: "https://www.facebook.com/reel/2503705946778557/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t15.5256-10/752290648_1325055199775076_5082884646012157600_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=107&ccb=1-7&_nc_sid=1a6f08&_nc_ohc=JqJYA-I4atgQ7kNvwFqf0RC&_nc_oc=Adr0Bq1KI6mRSjvgDo-bMRxnVmOrdZIzcXxpuwMiDaFuCWPVT4zz0MZCVEEaY6p6AFX6OlBrJg6eGCQX9NhUS9Xj&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=6bPdgvNHyvhpLvllmfAp5A&_nc_ss=7b289&oh=00_AQCxZPDaPNS5fHECha9EOC7jN3cmtdJkptL8jqWYEKmQvg&oe=6A691CAE", tr: "لا يوجد محتوى صوتي. النص الظاهر: رجع الغالي.. بس مش غالي..", s: "<ul><li><strong>التسويق العاطفي المباشر:</strong> تقديم منتج (منفاخ سيارات محمول) كان يتمتع بشعبية وجودة عالية ('رجع الغالي') بسعر تنافسي ('بس مش غالي').</li><li><strong>التركيز على استعراض المنتج:</strong> الاعتماد على العرض البصري (Product Showcase) لإظهار الجودة دون الحاجة لشرح مطول.</li><li><strong>استهداف الباحثين عن الصفقات:</strong> مخاطبة الفئة التي تبحث عن جودة ممتازة بميزانية منخفضة.</li></ul>" },
            { c: "الربيع لكهرباء وزينة السيارات", d: "24 يوليو 2026", t: "اسمع صوت صح 🔊 بسعر مميز 🔥", v: "https://www.facebook.com/reel/3439891499503578/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t15.5256-10/756038977_2086738329386303_7378259974283029017_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=103&ccb=1-7&_nc_sid=1a6f08&_nc_ohc=2UswqAnT88IQ7kNvwEsZSHk&_nc_oc=AdqYMoiMLYfR0Zl5sp-21OL-O9S6NKY6HeoB-04JjWNFxkp9qCBOOTGS9-nl27boChUnlEjiNvz9kgDFRS57ikLx&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=YuCbtSk5XHw8QzQmhOt_kw&_nc_ss=7b289&oh=00_AQDoTZ6Va2VeBha5IV_k06yYXZpRPG7QMtSuf2JsOvv0jw&oe=6A692B5B", tr: "لأي حدا ما عنده بيس بالسيارة، وبعاني من موضوع الدقة.. اليوم الربيع جابلكم البازوكا... راح توفر بـ طبلون سيارتك مساحة كتير... من شركة مستر سمارت... كل صب 3000 واط... بيجي معها أمبليفاير... استناني عن سعرها بالتعليقات، متوفرة في جميع أفرعنا في عمان وإربد، تركب على أي نوع سيارة.", s: "<ul><li><strong>تحديد المشكلة:</strong> التركيز على نقاط الألم (ضعف مستويات البيس واستهلاك المساحات الكبيرة).</li><li><strong>تقديم الحل:</strong> المنتج كبديل متكامل يوفر مساحة (Compact Design) دون الحاجة لأنظمة معقدة.</li><li><strong>بناء الثقة:</strong> استخدام البرهان الاجتماعي (مستر سمارت) وتحديد المواصفات (3000 واط).</li><li><strong>التشويق:</strong> عدم ذكر السعر مباشرة لزيادة التعليقات وتقليل الحاجز الجغرافي (عمان وإربد).</li></ul>" },
            { c: "الربيع لكهرباء وزينة السيارات", d: "24 يوليو 2026", t: "ما في داعي تعاني من ضعف الإنارة في الشارع بعد اليوم‼️", v: "https://www.facebook.com/reel/3373355812835500/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t15.5256-10/722994746_893593493819184_481931931187476655_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=104&ccb=1-7&_nc_sid=1a6f08&_nc_ohc=3YXeU5mPbQQQ7kNvwHG0WGj&_nc_oc=Adqngp2qoEjEQMLiNr--Uj-hBag150-xhBfZxdrEZj_8D3Ih7JTG9G3LuEKh3Z_OcFD2p67OiGOq8NeFGLT1Wwcm&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=YuCbtSk5XHw8QzQmhOt_kw&_nc_ss=7b289&oh=00_AQByQBX23Y5ad11G0sqk6zXcgIOj5BB-JKBhKS2_yoFWrA&oe=6A693BF5", tr: "هاي العدسة لازم تكون راكبة بكل السيارات... اضاءة قوية جداً.. خط عيار.. اضاءة مركزة وغير مشتتة... مدى أكثر من 400 متر... بنقدر نركب هاي العدسات على السيارة... راح يكون عليها سنة كفالة خطية.. اكتب نوع سيارتك ليصلك السعر.", s: "<ul><li><strong>الشمولية في الجمهور المستهدف:</strong> التأكيد على أن المنتج يركب على 'كل أنواع السيارات'.</li><li><strong>إبراز الميزات التنافسية (USP):</strong> توضيح نقاط الألم في الإضاءة التقليدية وتقديم الحل (إضاءة مركزة، مدى يتجاوز 400 متر).</li><li><strong>تعزيز الثقة:</strong> تقديم 'كفالة خطية لمدة سنة' لتقليل مخاطر الشراء.</li><li><strong>دعوة ذكية لاتخاذ إجراء (CTA):</strong> 'اكتب نوع سيارتك ليصلك السعر' لجمع الاستفسارات وزيادة معدل التفاعل.</li></ul>" },
            { c: "الربيع لكهرباء وزينة السيارات", d: "24 يوليو 2026", t: "فن😁🔥", v: "https://www.facebook.com/reel/1023269563945758/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t15.5256-10/756342412_935581802890478_2204514280979557416_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=109&ccb=1-7&_nc_sid=1a6f08&_nc_ohc=IPHxxpUPWTcQ7kNvwGHN57E&_nc_oc=Adq3nRAt6zTKFrbGOQJWO3Ig5g9uI8UB4zgZkFx0ISZLuJ6SWDO1TRagXW9JeyJnvBcYMLnh5m6SPXD48Kv7SnL97&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=6bPdgvNHyvhpLvllmfAp5A&_nc_ss=7b289&oh=00_AQDrhiMB1DWVoM4uhI_SuwjwQS8JZ9eW93ueEl8exHkNpw&oe=6A691BC7", tr: "لا يوجد تفريغ صوتي.", s: "فيديو قصير يعتمد على العرض البصري لجودة العمل (فن) لجذب الانتباه دون شرح." },
            { c: "الربيع لكهرباء وزينة السيارات", d: "24 يوليو 2026", t: "اغلب اللي معهم سيارة قديمة بدور على هاي القطعة 🫣🤫", v: "https://www.facebook.com/reel/1585793616417521/", i: "https://scontent-lga3-3.xx.fbcdn.net/v/t15.5256-10/755432690_1049140177459032_1079427253218463065_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=108&ccb=1-7&_nc_sid=1a6f08&_nc_ohc=HT7F5vy6dL0Q7kNvwFphl-W&_nc_oc=AdpojaH0A4LLK0x52ZQ9kC17Ze-hI4qxgK-_MpfUi-uMmSGwTuTZdKiT2oyE4uNBtC4&_nc_zt=23&_nc_ht=scontent-lga3-3.xx&_nc_gid=VMSyjQcK2YSAj2sQ0QiVxw&_nc_ss=7b289&oh=00_AQAYwzYFD90bW3vmeIUs1HMfVz_8ehvcq4QSICJo0RbhlA&oe=6A695ADF", tr: "في قطعة موجودة عندنا بس مش الكل بيعرفها، للسيارات القديمة اللي مسجلها ما بيدعم البلوتوث... هاي قطعة بلوتوث بتنشبك على المسجل، رح تقدر تشبك بلوتوث لتلفونك وفيها مايك... زهقت من وصلات الـ AUX وعجقة الأسلاك؟ انسى يا معلم...", s: "<ul><li><strong>تحديد نقطة الألم (Pain Point):</strong> غياب تقنية البلوتوث في المسجلات الأصلية والاضطرار لاستخدام أسلاك AUX.</li><li><strong>تقديم الحل (The Solution):</strong> عرض المنتج كـ 'محول بلوتوث' ذكي يمنح المسجلات القديمة وظائف حديثة.</li><li><strong>تغيير المفاهيم الخاطئة:</strong> التوعية بأن القطعة ليست 'فلاشة' بل 'محول بلوتوث'.</li><li><strong>عامل الجذب:</strong> التركيز على قيمة الأمان (الرد على المكالمات بدون مسك الهاتف أثناء القيادة).</li></ul>" },
            { c: "الربيع لكهرباء وزينة السيارات", d: "24 يوليو 2026", t: "ما معك وقت تصلح المكيف؟؟ عادي الحل عنا 🤩👌🏻", v: "https://www.facebook.com/reel/1546465620354006/", i: "https://scontent-lga3-1.xx.fbcdn.net/v/t15.5256-10/756768061_1052889980583280_1187299424971804466_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=103&ccb=1-7&_nc_sid=1a6f08&_nc_ohc=Z-3P1bdbB_QQ7kNvwF_BW34&_nc_oc=AdphbP4Sa9TsBbP48174I-dYg9wPx9mfFbwc1hXDNleo5spShS57obvnuxRSfby8_28&_nc_zt=23&_nc_ht=scontent-lga3-1.xx&_nc_gid=VMSyjQcK2YSAj2sQ0QiVxw&_nc_ss=7b289&oh=00_AQA1lum3d52Ujtf-Zf2lh4AsacaEyXs0GbhgMUVeKMvqHQ&oe=6A6954C0", tr: "يحتوي على موسيقى تصويرية. النص المكتوب: الجو ناررر🔥 بس عادي انت معك مروحة تابلو متحركة 360 درجة", s: "<ul><li><strong>معالجة نقطة ألم (Pain Point):</strong> ربط المنتج بمشكلة يعاني منها الجميع (حرارة الجو) لخلق حاجة فورية.</li><li><strong>استعراض عملي وسريع:</strong> التركيز على الجانب الوظيفي للمنتج (سهولة التركيب، الدوران 360 درجة).</li><li><strong>التسويق المباشر (Direct Sales):</strong> تقديم حل مباشر وعملي مناسب لنمط التصفح السريع.</li></ul>" },
            { c: "الربيع لكهرباء وزينة السيارات", d: "24 يوليو 2026", t: "📍تذكيراً ✅ بستناك👀🚨", v: "https://www.facebook.com/reel/2257298885028560/", i: "https://scontent-lga3-3.xx.fbcdn.net/v/t15.5256-10/756038997_1791217631799598_3701437951024194840_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=102&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=BWRqMbijVswQ7kNvwGeK0ED&_nc_oc=AdrAUTwGWBuEcXNx1x2L86TK50oK9aUIl-TiE14i9lBXXVaxdGbIcl1aOlceC6VCoHw&_nc_zt=23&_nc_ht=scontent-lga3-3.xx&_nc_gid=VMSyjQcK2YSAj2sQ0QiVxw&_nc_ss=7b289&oh=00_AQD5MW5o4eirophiqULyDLYs-3cuF9a2loF2XDw9r1qj_w&oe=6A694890", tr: "جاهز؟ تذكيراً بجميع عروضنا في شهر 8: 1- عرض الغاز بأقل الأسعار. 2- عرض الستكر بانوراما بـ 10 دنانير. 3- عرض مظلة للقزاز الأمامي بدينارين. 4- 3 أطقم ليزر بـ 25 دينار. 5- عرض فرش الجلد فقط بـ 21 دينار مع طارة خياطة هدية... جمعة مباركة عليكم.", s: "<ul><li><strong>هيكلية العرض المكثف:</strong> عرض قائمة '5 في 1' لخدمات متنوعة في وقت قصير لضمان بقاء المشاهد مهتماً.</li><li><strong>خلق الحاجة (Pain Points):</strong> تحديد مشكلة العميل (الحرارة، عيوب الطلاء، ضعف الإضاءة) وتقديم الحل بأسعار تنافسية.</li><li><strong>عامل الجذب السعري:</strong> التركيز على 'أقل الأسعار' و'هدايا إضافية' لتحفيز اتخاذ قرار سريع.</li><li><strong>بناء الثقة:</strong> إشراك شخصية 'أبو زيد' لتعزيز المصداقية وبناء علاقة عاطفية مع الجمهور.</li></ul>" },
            { c: "الربيع لكهرباء وزينة السيارات", d: "24 يوليو 2026", t: "لmdة يومين فقط 🔥🔥", v: "https://www.facebook.com/reel/1783597409727683/", i: "https://scontent-lhr11-1.xx.fbcdn.net/v/t15.5256-10/756846597_1355420906005885_986463895783662611_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=100&ccb=1-7&_nc_sid=1a6f08&_nc_ohc=oibMF63YclYQ7kNvwFTokC0&_nc_oc=AdouZHJB3eotuxCCeU-DsZOiq8AEJIlIsEHEKfMJZ0xWgMwC-yJC2cyvxlc16dwFq20&_nc_zt=23&_nc_ht=scontent-lhr11-1.xx&_nc_gid=50MRS_r97Pjk5eOfhf9bsg&_nc_ss=7b289&oh=00_AQCyKDONKsiNxRYlQMMAdW2N1J_ALs9JHHbiPr3uMfdxsw&oe=6A69636E", tr: "لا تفوتوا الفرصة.. لا بـ 100 ولا بـ 50 ولا بـ 4 ولا بـ 3، فقط بدينارين! وعندك هون تعكس أشعة الشمس والحرارة، بتحافظ على غرفة سيارتك... بتيجي لكل أنواع السيارات، بتركب عالقزاز 100%، فقط بدينارين داخل محل (تكنو برو)... الحق العرض بس لنهاية يوم السبت.", s: "<ul><li><strong>خطاف الانتباه (The Hook):</strong> أسلوب 'التسعير التنازلي' لخلق فضول لمعرفة السعر النهائي.</li><li><strong>القيمة البيعية الواضحة:</strong> حل مشكلة مؤلمة (ارتفاع حرارة المقصورة) بمنتج عملي ومنخفض التكلفة.</li><li><strong>العرض الترويجي:</strong> ربط السعر بمدة زمنية محدودة جداً لدفع المشاهد للشراء فوراً (FOMO).</li><li><strong>الأسلوب الإخراجي:</strong> البساطة والعفوية لتعزيز المصداقية وجعل الإعلان كأنه عرض مباشر.</li></ul>" },
            { c: "المهندس حسام لزينة السيارات فرع عمان", d: "23 يوليو 2026", t: "#عمان 0799634808 #اربد 0786105445", v: "https://www.facebook.com/reel/1507658710673203/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t15.5256-10/755693244_1904528137618183_2497759843740949588_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=107&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=w4Un-GA2tYsQ7kNvwHGxLWv&_nc_oc=Adp_YXwUOc_hh1Xu3szMf5LH7T4gwOfeBSzptIlq-cD7OR06crOBVOJuLTrIKU7CkGANQdGaE86U0lU0jcZt8B3d&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=6GSa0JTUQPS8lVv_K1V15A&_nc_ss=7b289&oh=00_AQBxxSSqi2keDiOGOEZjpWQ4PdFlX9XdTZlG94blOZBoFw&oe=6A6A458A", tr: "ونشوف بسم الله ما شاء الله، شاشة أربعة جيجا رام، أقوى معالج على مستوى العالم... دائماً لما أحكيلك مرسيدس يعني اختصاصنا... شغلنا نظام فيش بفيش، بالإضافة للكاميرا الـ Edge Royal... مرسيدس الـ ML المعلم من أصعب السيارات للشغل... تذكر نوع سيارتك بالتعليقات راح أصدملك بأقوى شاشة.", s: "<ul><li><strong>إبراز القيمة التقنية (USP):</strong> التركيز على أقوى معالج وتوافق كامل مع أنظمة السيارة الأصلية.</li><li><strong>إثبات الكفاءة:</strong> وضع المركز في موقع الخبير المتخصص بسيارات مرسيدس لرفع ثقة العميل.</li><li><strong>الخدمة المتكاملة:</strong> شمل العرض كاميرا عالية الدقة لتعزيز فكرة التجهيز الكامل.</li><li><strong>استراتيجية التفاعل:</strong> طلب 'ذكر نوع السيارة في التعليقات' لبناء قاعدة بيانات للعملاء المحتملين.</li></ul>" },
            { c: "غازي الزعبي لزينة و كهرباء السيارات", d: "23 يوليو 2026", t: "متخيل بس بدينار واحد 📍", v: "https://www.facebook.com/reel/2256098575157592/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t51.71878-10/754462802_1805136030480912_7365097610848698945_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=105&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=asGV1JPTaFkQ7kNvwGIL69x&_nc_oc=Adp_cSJrwNXbm7GuUJwcL58audzKZQBny5HYnP8FYceidWhMALtIDdh2zSSL6xKjEO8o5L_YEjXkG0OISMew1KT4&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=u4ScrW2vEUvwGYzQG1splw&_nc_ss=7b289&oh=00_AQDsHVKKFS6qImv6zYLKhnwLoHkWQkqY3XOTyIz3EQL6ug&oe=6A6A4B2E", tr: "ولك تامر شو في عندك اليوم؟ تعال افرجيك.. بس بدينار واحد شو بتقدر تشتري؟ ملمع M7 حبتين بدينار. شريط الغزال الحبة بدينار. ومعطر الداخلية حبة بدينار. وإشارة التاكسي كمان الحبة بدينار. والإنارة المخفية الحبة بدينار... والعرض لمدة أسبوع كامل.", s: "<ul><li><strong>توحيد السعر كعامل جذب (Anchor Pricing):</strong> استخدام سعر رمزي واحد ('بدينار') لخلق انطباع بصفقة رابحة وتقليل حواجز الشراء.</li><li><strong>الإيقاع السريع والتغيير البصري:</strong> انتقالات سريعة مع تكرار عبارة 'الحبة بدينار' لترسيخ الفكرة وتجنب الملل.</li><li><strong>التنوع في المنتجات:</strong> عرض مجموعة متنوعة ليخاطب أكبر شريحة من أصحاب السيارات.</li><li><strong>استراتيجية الندرة:</strong> تحديد العرض بمدة زمنية ('أسبوع واحد') لتشجيع زيارة المتجر فوراً.</li></ul>" },
            { c: "المهندس حسام لزينة السيارات فرع عمان", d: "23 يوليو 2026", t: "#عمان 0799634808 #اربد 0786105445", v: "https://www.facebook.com/reel/1277078917677902/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t15.5256-10/755386079_1526948738476976_9152763754576624913_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=108&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=UBfLPkybi1oQ7kNvwEtT-zr&_nc_oc=AdqeudsY0YwIoNifz14sq_ly3zjHZG_FTGN6K6UPiS_PRFKk-SVBtIkuwl3aUICAXG7Z8oAfuoU0tLpAZy_kMTmQ&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=6GSa0JTUQPS8lVv_K1V15A&_nc_ss=7b289&oh=00_AQDJwlqV6z5YWCUKBduPcLgwQOizoBb1__31a0RSeEQ4Hw&oe=6A6A590F", tr: "هذه شاشات الـ 2K، شاشة من أجمل الشاشات... عندك نظام الكار بلاي، الأندرويد أوتو فعال، البلاي ستور... اليوم معطيك أقوى عرض على مستوى المملكة كاملة... شو ما كان نوع سيارتك بعون الله متوفر، كل ما عليك تذكر نوع سيارتك بتعليق.", s: "<ul><li><strong>استغلال الفيديو القصير:</strong> وتيرة سريعة لجذب الانتباه في الثواني الأولى.</li><li><strong>التركيز على القيمة التقنية:</strong> ذكر نقاط القوة (دقة 2K، أندرويد أوتو، كار بلاي) لإقناع المشاهد بالجودة.</li><li><strong>استراتيجية الندرة والعرض المحدود:</strong> 'أقوى عرض على مستوى المملكة' لخلق دافع لاتخاذ إجراء سريع.</li><li><strong>التحفيز على التفاعل:</strong> طلب كتابة نوع السيارة في التعليقات لرفع معدل التفاعل (Engagement Rate).</li></ul>" },
            { c: "غازي الزعبي لزينة و كهرباء السيارات", d: "23 يوليو 2026", t: "فرصتك الآن.!! لأصحاب الخبرة فقط ⚠️⚠️", v: "https://www.facebook.com/reel/1009178915226585/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t51.82787-10/755867818_18096409904624786_5948413936382416310_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=104&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=_ngqyuJLVHcQ7kNvwHjnweH&_nc_oc=AdoRrPb4Ref1HM-8-90RYPUXPaDB0q5X3aSSyLlFmZHI4JadmD6U8g2K6iGQV20ZvMbWfvrG-HZ3DxYI3ktVfVk2&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=u4ScrW2vEUvwGYzQG1splw&_nc_ss=7b289&oh=00_AQAyd5S7f6HZeweZdv01Kb9OoiMhIEDo8zBGHGGVv6SSFw&oe=6A6A4E81", tr: "لا يوجد تفريغ صوتي متوفر للتحليل.", s: "منشور يعتمد على العنوان الجذاب 'لأصحاب الخبرة فقط' لخلق الفضول والاستهداف المباشر لفئة محددة، مع ذكر الفروع بوضوح لتوجيه الجمهور." },
            { c: "غازي الزعبي لزينة و كهرباء السيارات", d: "24 يوليو 2026", t: "ليل سيارتك صار نهار! 💡✨ لا تفوت أقوى عرض على لمبات M8 برو...", v: "https://www.facebook.com/reel/1563557245427103/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t51.71878-10/753337060_1942079329815225_8709759302867411091_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=102&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=h-kve1MgnnAQ7kNvwGFowAp&_nc_oc=AdqJxLuQvBu8YcKFx3jMf0Lpc2d7ZssbB5QaiRXRGwEKlFzRCShryHsyVe0ANw2_pNdUIUUiJMQmm6lhEOHvC0zF&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=u4ScrW2vEUvwGYzQG1splw&_nc_ss=7b289&oh=00_AQBbaojyq2AwHpzGTkkJcn67yzxTqtmT0Ov21VCDqjSPPg&oe=6A6A4B3E", tr: "بسعر التكلفة يا مشاهد.. بوعدك يا مشاهد بسعر التكلفة، ضواو M8 برو 120 واط للمبة الواحدة، إنارة واضحة وأهم إشي ما بتأذي الشخص اللي قبالك، وعليه حرق أسعار... فقط 8 دنانير.. والعرض لمدة 3 أيام وطالع من الفرع الرئيسي؛ دوار الحمايدة... يا بتلحق يا بتروح عليك!", s: "<ul><li><strong>هندسة سعر الجذب:</strong> استخدام عبارة 'سعر التكلفة' و'حرق أسعار' لخلق انطباع بفرصة استثنائية.</li><li><strong>إبراز القيمة المضافة:</strong> التركيز على ميزة تقنية مهمة (إنارة واضحة ولا تؤذي السائقين الآخرين).</li><li><strong>خلق حالة من الاستعجال (Urgency):</strong> تحديد مدة العرض بـ 3 أيام وعبارات تحفيزية لاتخاذ قرار شراء فوري.</li><li><strong>تعزيز الثقة بالتفاصيل المكانية:</strong> ذكر المواقع بدقة لتسهيل التوجه الفعلي للعملاء.</li></ul>" },
            { c: "غازي الزعبي لزينة و كهرباء السيارات", d: "24 يوليو 2026", t: "يا بتلحق يا بتروح عليك.!!", v: "https://www.facebook.com/reel/1066064892746407/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t51.82787-10/753381995_18096553346624786_1872900614920436317_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=102&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=xQB36lq0yR4Q7kNvwFVP-rX&_nc_oc=AdoNXmblxuRwTCjOtl47w5vw9soiWWPEt5H1-3wwwJdR4CIpQxm58mWpyGfbclaX_pO4x_yx6ELdxNDRB_OvBv5x&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=u4ScrW2vEUvwGYzQG1splw&_nc_ss=7b289&oh=00_AQAqmuxzdgcIa4ffCM1wRnpeRfSOuHgk8Uot0cJzVKBEtg&oe=6A6A4BDA", tr: "الحق الحق.. عندك اضواء الأوريكس 85 واط.. عندك اضواء ام 8 برو، ومع ضوء الليد، وعندك على الزوم فينجر اشتغلنا عليها ستيكر ضوئي، بريمبو.. تعال شوف الجمالية كيف طلعت.. معرض غازي الزعبي خيارك الأفضل.. يا بتلحق يا بتروح عليك.", s: "<ul><li><strong>التسويق الميداني القصير:</strong> موجه لجمهور الشباب المهتم بتعديل السيارات.</li><li><strong>عنصر الجذب (The Hook):</strong> أسلوب الاستعجال ونبرة صوت حماسية وسريعة.</li><li><strong>تنوع المنتجات:</strong> استعراض موديلات سيارات (أوريكس، تيسلا، فولكس فاجن) لإظهار القدرة على التعامل مع مختلف الأنواع.</li><li><strong>الرسالة الختامية:</strong> 'يا بتلحق يا بتروح عليك' كأسلوب نفسي قوي لخلق الخوف من ضياع الفرصة (FOMO).</li></ul>" },

            { c: "الربيع لكهرباء وزينة السيارات", d: "24 يوليو 2026", t: "جمالية قصه بازوكا دبل 2026 .. اسالني عن سعر بتعليقات...", v: "https://www.facebook.com/reel/1012545778292022/", i: "https://scontent-waw2-1.xx.fbcdn.net/v/t15.5256-10/755414007_1609663877343368_7263531917536366364_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=110&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=O8YHcTBrCCgQ7kNvwEGpAKW&_nc_oc=AdpKHVvfnUtCAEpzjCdPEIYoD0-Jb3AmiIlC_ASQRmvMAJb5Gkn9fDPv6dA-DIB8fUQ&_nc_zt=23&_nc_ht=scontent-waw2-1.xx&_nc_gid=SeZ1_102rqyYWVU4tYahWA&_nc_ss=7b289&oh=00_AQBOpaipHpRf5QwsuU5ckWY27TyC9r4cno9Wc3Vl_sVdvQ&oe=6A697559", tr: "اسمع الصوت، اسمع الصوت. عندك هون صبين مع تويترين، راح يعطيك كل واحد فيهم 4400 وات... دقة كثير بتجنن... بزوكا الدبل.. ما بدك تركب سيستم؟ استني على السعر بالتعليقات لجميع أنواع السيارات... هذا هو الربيع، ربيع دك اليمين، محطتنا في شارع المدينة.", s: "<ul><li><strong>الاستهداف المباشر:</strong> استهداف عشاق تعديل السيارات والبحث عن تجربة صوتية قوية.</li><li><strong>عنصر الجذب الحسي:</strong> إشراك المشاهد في تجربة 'الصوت' فوراً لكسر حاجز الملل.</li><li><strong>إبراز القيمة التقنية:</strong> التركيز على مواصفات دقيقة (4400 واط) لتعزيز الثقة.</li><li><strong>استراتيجية التفاعل:</strong> 'السعر في التعليقات' لزيادة معدل التفاعل وتحسين ظهور الفيديو.</li></ul>" },

            { c: "الربيع لكهرباء وزينة السيارات", d: "24 يوليو 2026", t: "عطاء خارجي وداخلي على الهونداي 🔥❤️ بافضل الاسعار...", v: "https://www.facebook.com/reel/27462651443403469/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t15.5256-10/755432758_1961327311212061_8359174524348631961_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=100&ccb=1-7&_nc_sid=1a6f08&_nc_ohc=c_QTOtaKCBcQ7kNvwG2IQKI&_nc_oc=AdrbkCGWCx2ZovnwW0dhUQ96srRacbRsOCvSqLs0nnH8nONhqTF7SLAbPcmg_ED57eqg-1TpUHcd7O25h6Ya6Jyo&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=_c85yN9MYmqU8m6gtRlW-A&_nc_ss=7b289&oh=00_AQDqREeDNUOS2Q4hfTjCHhHn-90pRlIFjy2ZFw2NTsLonQ&oe=6A699997", tr: "صاحب السيارة: الشباب مرتبين، الأسعار مناسبة للجميع، ركبوا لنا إضاءات زينون، مرشات، الشغل مية مية. المعلق: أكثر الشغلات اللي بحبها هي الإكسسوارات الخارجية.. ركب معنا كت كامل على الهونداي.. فول باكج بتيجي على التابلو وأربع بطاين.", s: "<ul><li><strong>بناء الثقة عبر الشهادات الحية:</strong> مقابلة مع عميل حقيقي يمدح الخدمة والأسعار.</li><li><strong>التركيز على القيمة المضافة (USP):</strong> إبراز الجماليات والإضافات الرياضية والعصرية.</li><li><strong>هيكلة العرض:</strong> استعراض بصري سريع للتفاصيل الدقيقة (قبل وبعد / الإبراز).</li><li><strong>الجاذبية البصرية:</strong> موسيقى عصرية وإضاءة جذابة في توقيت الغروب تخدم فكرة تزيين السيارات.</li></ul>" },

            { c: "Double M For Cars Accessories", d: "24 يوليو 2026", t: "اجاك تشيك انجن ؟ راح تلاقي الحل عنا ✨️🚗", v: "https://www.facebook.com/reel/1749213863101701/", i: "https://scontent-lga3-2.xx.fbcdn.net/v/t51.71878-10/755264139_2819225308453095_7493805883084098888_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=105&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=gvgcGB3wffAQ7kNvwGakpLn&_nc_oc=AdrWuQNdNhqBFJHgKev7AWgSF1Aycx3FcsPwQc0nwfWq-5bKv6HNdJZsLG1n7RmtMkM&_nc_zt=23&_nc_ht=scontent-lga3-2.xx&_nc_gid=uVU8sf8vgxCg8f5VDHXlTQ&_nc_ss=7b289&oh=00_AQCg7yCZKAOwvWg2--q1s1STLTFOYGFhTnzxF5TUtOZBog&oe=6A695ABD", tr: "أويدجل، يوم اللي يطلعلك (تشيك إنجن) ومش عارف شو المشكلة، بسيطة عزيزي.. جيبها على (دبل إم) وبنفحص لك السيارة بأحدث الأجهزة... ودامك جاي، افحص الـ AC... متوفر عنا أجود أنواع الغاز بالسوق، غاز إيطالي... اكتب لي بالتعليقات شو مشكلتك، الـ (دبل إم) بظهرك.", s: "<ul><li><strong>تحديد نقطة الألم (Pain Point):</strong> مشكلة شائعة ومزعجة (ظهور إضاءة تشيك إنجن).</li><li><strong>تقديم الحل:</strong> تقديم المركز كـ 'منقذ' سريع يعتمد على التكنولوجيا الحديثة.</li><li><strong>سياسة البيع المتقاطع (Cross-selling):</strong> استغلال وجود العميل لتقديم خدمة إضافية (فحص التكييف).</li><li><strong>بناء العلاقة:</strong> استخدام عبارات مثل 'دبل إم بظهرك' لتعزيز الولاء للعلامة التجارية.</li></ul>" },

        // دالة لإنشاء التبويبات والمحتوى
        function generateReport() {
            const container = document.getElementById('reportContainer');
            const tabsContainer = document.getElementById('tabsContainer');
            const competitors = {};
            
            // تجميع البيانات حسب المنافس
            reportData.forEach(item => {
                if (!competitors[item.c]) {
                    competitors[item.c] = [];
                }
                competitors[item.c].push(item);
            });

            // إنشاء التبويبات
            Object.keys(competitors).forEach(comp => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn';
                btn.innerText = comp;
                btn.setAttribute('onclick', `openTab(event, '${comp.replace(/[^a-zA-Z0-9]/g, '')}')`);
                tabsContainer.appendChild(btn);
            });

            // إنشاء المحتوى
            let html = '';

                const compId = comp.replace(/[^a-zA-Z0-9]/g, '');

                html += `<div class="competitor-header"><h2>${comp}</h2><span class="badge">${competitors[comp].length} منشور</span></div>`;
                
                competitors[comp].forEach(item => {
                    html += `
                    <div class="card">

                        </div>

                                </div>
                                <div class="block">
                                    <h3>📊 الملخص الاستراتيجي</h3>
                                    ${item.s || '<p>لا يوجد ملخص متاح.</p>'}
                                </div>
                            </div>
                        </div>
                    </div>`;
                });
                
                html += `</div>`;
            });
            
            container.innerHTML = html;
        }

        // دالة التبديل بين التبويبات
        function openTab(evt, tabName) {
            const tabcontent = document.getElementsByClassName('tab-content');
            for (let i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            const tablinks = document.getElementsByClassName('tab-btn');
            for (let i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            
            if (tabName === 'all') {
                // إظهار الكل
                for (let i = 0; i < tabcontent.length; i++) {
                    tabcontent[i].style.display = "block";
                }
            } else {
                document.getElementById(tabName).style.display = "block";
            }
            evt.currentTarget.className += " active";
            
            // إعادة ضبط البحث
            document.getElementById('searchInput').value = '';
            searchReport();
        }

        // دالة البحث
        function searchReport() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const cards = document.getElementsByClassName('card');
            let visibleCount = 0;

            for (let i = 0; i < cards.length; i++) {
                const cardText = cards[i].innerText.toLowerCase();
                if (cardText.includes(searchTerm)) {
                    cards[i].style.display = '';
                    visibleCount++;
                } else {
                    cards[i].style.display = 'none';
                }
            }

            const noResults = document.getElementById('noResults');
            if (visibleCount === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
            }
        }

        // تشغيل السكريبت عند تحميل الصفحة
        generateReport();
    </script>
</body>
</html>
