    function fmtDate(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        var m = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
        return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();
    }

    /* ===== دالة تحويل Markdown إلى HTML ===== */
    function md2html(md) {
        if (!md || md.trim() === '' || md.trim() === '*') return '<p class="na-msg">لا يتوفر</p>';
        var h = md;
        h = h.replace(/^###\s*.+$/gm, '');
        h = h.replace(/^---+$/gm, '');
        h = h.replace(/^\*\*\[(.+?)\]\(.*?\)\*\*:?\s*(.*)$/gm, '<li><strong>$1:</strong> $2</li>');
        h = h.replace(/^\*\*\*(.+?)\*\*\*:?\s*(.*)$/gm, '<li><strong>$1:</strong> $2</li>');
        h = h.replace(/^\*\s*\*\*(.+?)\*\*:?\s*(.*)$/gm, '<li><strong>$1:</strong> $2</li>');
        h = h.replace(/^\*\s+(.+)$/gm, '<li>$1</li>');
        h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        h = h.replace(/((?:<li>[\s\S]*?<\/li>\s*)+)/g, '<ul>$1</ul>');
        h = h.replace(/<\/ul>\s*<ul>/g, '');
        var lines = h.split('\n');
        var out = [];
        for (var i = 0; i < lines.length; i++) {
            var ln = lines[i].trim();
            if (ln === '') continue;
            if (ln.indexOf('<') === 0) { out.push(ln); }
            else { out.push('<p>' + ln + '</p>'); }
        }
        return out.join('\n');
    }

        "tr": "أهلاً بك. بصفتي خبيراً في تحليل المحتوى، إليك تفريغ النص والتحليل الاستراتيجي للفيديو:\n\n### أولاً: التفريغ النصي للفيديو\n**النص المكتوب على الشاشة:**\n\"مين قلك الكوبيه ما يركب عليها مساطر 😍\"\n\n**المحتوى الصوتي (الأغنية):**\nيحتوي الفيديو على مقطع صوتي لأغنية أجنبية إيقاعية (ريمكس) تتضمن كلمات \"Guess who's going back\" بشكل متكرر ومتزامن مع إيقاع الأغنية.\n\n---\n\n### ثانياً: الملخص الاستراتيجي (تحليل المحتوى)\n\nيهدف الفيديو إلى تسويق خدمة تعديل وتزيين السيارات (إضافة إضاءة محيطية - Ambient Lighting)، ويمكن تلخيص استراتيجية المحتوى في النقاط التالية:\n\n*   **تحدي \"الاعتقاد السائد\":** يستخدم الفيديو أسلوب \"كسر القواعد\" من خلال العبارة الافتتاحية (\"مين قلك...؟\")، مما يحفز المشاهد على الفضول لمعرفة النتيجة، ويخاطب تحديداً فئة مالكي سيارات \"الكوبيه\" الذين قد يعتقدون أن تعديلات الإضاءة لا تناسب سياراتهم.\n*   **التركيز على القيمة البصرية (Before & After):** يعتمد الفيديو على مبدأ الاستعراض السريع للعملية، حيث يبدأ بمرحلة التركيب (إظهار المهارة الفنية والاحترافية في التفكيك والتركيب) وينتهي بعرض الإضاءة وهي تعمل داخل المقصورة، مما يخلق تأثيراً \"مبهراً\" لدى المشاهد.\n*   **استغلال الترند (التزامن مع الإيقاع):** تم تصميم الفيديو بحيث تتغير ألوان الإضاءة وتتبدل لقطات الكاميرا بالتزامن مع إيقاع الموسيقى (Beat Sync)، وهو أسلوب فعال جداً في منصات الفيديو القصيرة (TikTok/Reels) لزيادة معدل الاحتفاظ بالمشاهد (Retention Rate).\n*   **خلق الرغبة (Emotional Trigger):** استخدام الرموز التعبيرية الجذابة (😍) والتركيز على جمالية المقصورة بعد التعديل يهدف إلى تحويل المشاهد من \"مجرد متابع\" إلى \"عميل محتمل\" يرغب في الحصول على نفس المظهر لسيارته.\n*   **رسالة تسويقية مباشرة:** الفيديو موجه بشكل خاص لمحبي تعديلات السيارات، ويبرز تخصص المركز في التعامل مع أنواع محددة وصعبة من السيارات (الكوبيه) بإتقان.",

تفاعلي لا يعتمد على السرد الممل، بل على إبراز \"حل المشكلات\" التي يواجهها المستخدم في صيانة الأدوات اليومية.",

        "s": "### 2. الملخص الاستراتيجي (تحليل المحتوى)\n\nيهدف هذا الفيديو إلى تقديم منتج صوتي (مضخم صوت/Subwoofer) بأسلوب استعراضي بصري جذاب، ويمكن تلخيص الاستراتيجية التسويقية للفيديو في النقاط التالية:\n\n*   **التركيز على \"هوية المنتج\":** اعتمد الفيديو على إبراز التفاصيل التصميمية للمنتج (اللون الأحمر الجذاب للسماعة، الشبكة المعدنية الواقية، والملمس الخارجي للصندوق) لإظهار الجودة والمتانة.\n*   **استخدام \"التسويق الحسي\":** استخدام القفازات البيضاء في عرض المنتج يعطي إيحاءً للمشاهد بالفخامة، والدقة، والاهتمام بالتفاصيل (Premium Quality)، كما أنها تركز انتباه المشاهد على القطع التي يلمسها المروج دون تشتيت.\n*   **عنصر المفاجأة (Unboxing/Features):** قام الفيديو باستعراض المكونات الملحقة مثل \"المضخم الكهربائي\" (Amplifier) ليعطي المشاهد فكرة متكاملة عن المجموعة الصوتية، وليس مجرد سماعة واحدة، مما يرفع من القيمة المدركة للمنتج.\n*   **الإيقاع السريع (Fast-Paced Editing):** تم مزامنة حركة الكاميرا واللقطات مع إيقاع الأغنية (Audio-Visual Sync)، وهو أسلوب ناجح جداً في منصات الفيديو القصيرة (Reels/TikTok) لزيادة معدل الاحتفاظ بالمشاهد (Retention Rate).\n*   **الرسالة الضمنية:** الفيديو يروج لمنتج يجمع بين الأداء القوي (Heavy/Subwoofer) وسهولة الاستخدام أو التصميم العصري (Light/Sleek)، مستهدفاً فئة الشباب وعشاق تعديل أنظمة الصوت في السيارات.\n\n**الخلاصة:** الفيديو ناجح كإعلان تشويقي (Teaser) يعتمد على الإبهار البصري، وهو فعال جداً لجذب انتباه الجمهور المستهدف في ثوانٍ معدودة قبل الانتقال للمرحلة التالية من رحلة العميل (سواء كان رابط شراء أو زيارة لصفحة المنتج)."

        "tr": "أهلاً بك. بصفتي خبيراً في تحليل المحتوى التسويقي، قمت بتحليل الفيديو الخاص بـ \"جي بي\" (GB) لتغطية كراسي السيارات، وإليك النتائج المطلوبة:\n\n### أولاً: التفريغ النصي للفيديو\n\n*   **0:00 - 0:02:** \"ليش تظلك على فرش ممل وبيخرب بسرعة؟ وعندك الجي بي (GB).\"\n*   **0:03 - 0:05:** \"اللي بيحول سيارتك لمودرن وسبورت.\"\n*   **0:06 - 0:08:** \"هذا الفرش صناعة تركية، والحلو بيركب على سيارتك كانه فرش أصلي.\"\n*   **0:09 - 0:12:** \"ومتوفر من هذا الفرش عدة ألوان وقصات تناسب ذوقك واختيارك.\"\n*   **0:13 - 0:17:** \"تحس بجودة الفرش الأصلية، وراح يركب على أيد الفنيين.\"\n*   **0:18 - 0:20:** \"يعني ولا غلطة، راح يطلع من هذا الفرش.\"\n*   **0:21 - 0:23:** \"فإذا كنت محتار شو تركب فرش لسيارتك، فالجي بي (GB) هو الاختيار الصح.\"\n*   **0:24 - 0:29:** \"إذا مهتم بهذا الفرش وحابب يركب على سيارتك، اكتب لي جي بي (GB) أو زورونا بالفرعين مقابل دوار الحويان أو مقابل حرية مول.\"\n\n---\n\n### ثانياً: الملخص الاستراتيجي للفيديو (تحليل المحتوى)\n\nيعد هذا الفيديو نموذجاً ممتازاً لإعلانات \"حل المشكلة\" (Problem-Solution) السريعة لمنصات التواصل الاجتماعي (Reels/TikTok)، ويمكن تلخيص استراتيجيته في النقاط التالية:\n\n*   **تحديد نقطة الألم (Pain Point):** بدأ الفيديو بالتركيز على المشكلة (فرش السيارة القديم، الممل، وسريع التلف) لجذب انتباه صاحب السيارة الذي يشعر بالملل من مظهر مقاعده.\n*   **القيمة المقترحة (Value Proposition):** قدم الفيديو الحل \"جي بي\" (GB) كمنتج يجمع بين الأناقة (Modern & Sport) والجودة (صناعة تركية) والاحترافية في التركيب (كأنه فرش أصلي).\n*   **الخيار البديل للتشكيك:** استخدم الفيديو \"الدليل البصري\" للتأكيد على تنوع الخيارات (ألوان وقصات مختلفة) لتناسب جميع الأذواق، مما يقلل من حاجز التردد لدى العميل.\n*   **بناء الثقة:** التركيز على أن التركيب يتم على \"أيد الفنيين\" يعطي انطباعاً بالجودة والاحترافية (\"يعني ولا غلطة\")، مما يطمين العميل بأن المنتج النهائي سيكون بمستوى عالٍ.\n*   **دعوة واضحة لاتخاذ إجراء (Call to Action):** اختتم الفيديو بـ CTA مزدوج:\n    *   **تفاعلي:** \"اكتب لي جي بي\" لزيادة التفاعل (Engagement) وتعزيز خوارزميات المنصة.\n    *         "tr": "أهلاً بك. بصفتي خبيراً في تحليل المحتوى، إليك التفريغ النصي والملخص الاستراتيجي للفيديو:\n\n### أولاً: التفريغ النصي للفيديو\n\n\"كيف هذا المنتج الجبار راح يكون جميع أدواتك جوا السيارة؟ هو بيجي عبارة عن 3 أشياء، الشيء الأول هو عبارة عن باور بانك، زي ما أنت شايف قدرة تشغيلية عالية راح يشغل لك أغلب السيارات الموجودة في الشارع عن طريق سلك التشتريك هذا زي ما أنت شايف. \n\nبس بنفس الوقت في منتج سحري معاه في نفس الباكج، راح تقدر تستعمله مع نفس الباور بانك بهاي الطريقة، منفاخ صغير سلكه على نفس سلك الباور بانك. [صوت تشغيل المنفاخ] حرفياً إذا كنت هون أو هون أو هون راح تقدر إنك تنفخ عجلة سيارتك بدون ما تمد سلك لأي مكان في السيارة، وغير هيك بيجي معه ضوء (SOS) هذا، راح يساعدك في أوقات الأزمة.\n\nوطبعاً هذا الباكج عليه عرض خرافي من معارض الدبل إم، زي ما أنت شايف باور بانك كامل لتشريك السيارات وبنفس الوقت شاحن لتلفوناتك ولابتوباتك مع المنفاخ القوي تبعه، كله في باكج واحد، والسعر جبار في معرض الدبل إم. كل اللي عليك تكتب لي في التعليقات: (باكج منفاخ) برد عليك بكل التفاصيل، سلام عليكم.\"\n\n---\n\n### ثانياً: الملخص الاستراتيجي (التحليلي)\n\nيهدف الفيديو إلى استعراض منتج تقني متعدد الاستخدامات (Jump Starter & Air Compressor) عبر إبراز قيمته المضافة وسهولة استخدامه، ويمكن تلخيص استراتيجية المحتوى في النقاط التالية:\n\n*   **عرض \"الكل في واحد\" (All-in-One Value):** يركز الفيديو على فكرة \"الاختصار\"؛ حيث يجمع الجهاز بين 3 وظائف حيوية لأي سائق: تشغيل السيارة (Jump starter)، شحن الأجهزة الإلكترونية (Power Bank)، ونفخ الإطارات (Air Compressor).\n*   **استراتيجية العرض العملي (Demonstration):** اعتمد المتحدث على عرض المنتج فعلياً (بدلاً من الاكتفاء بالوصف)، حيث قام بتوصيل القطع ببعضها وإظهار قوة المنفاخ وميزة إضاءة الطوارئ، مما يعزز ثقة العميل في كفاءة المنتج.\n*   **استغلال نقاط الألم (Pain Points):** ركز على حل مشكلات شائعة تواجه أصحاب السيارات (تعطل البطارية، الحاجة لمحطات الوقود لنفخ الإطارات، والحاجة لمصدر طاقة متنقل)، وقدم المنتج كحل فوري لهذه الأزمات.\n*   **هندسة التفاعل (Call to Action):** استخدم استراتيجية \"الكلمة المفتاحية\" في التعليقات (\"باكج منفاخ\")، وهي ت         "tr": "أهلاً بك. بصفتي خبيراً في تحليل المحتوى، قمت بمراجعة الفيديو بعناية وتجهيز المطلوب أدناه:\n\n### أولاً: التفريغ النصي للفيديو\n\n\"أهلاً بيكم يا أخوان، اليوم جيناكم بقطعة ولا أروع، شوفوا معي، بسم الله ما شاء الله، ركبنا اليوم شاشة مرسيدس بنز سي كلاس، خلينا نشوف سوا، طبعاً الشاشة بتدعم نظام الأندرويد بالكامل، تقدر تدخل على تطبيقاتك، يوتيوب، كروم، إعدادات، وكل شيء تحتاجه موجود جواها. وأي ثيم أصلي بالكامل زي ما أنت شايف بسم الله ما شاء الله، تتحكم فيها عن طريق الماوس، كل شيء طبيعي 100%، طلع كيف، كل شيء ممكن تحتاجه موجود جواها، وعندك هنا فتحت الأبواب بتبين عليها، هاي الشاشة 8 جيجا رام، 256 مساحة تخزينية، بالإضافة لتطبيقات الـ DSP المتكامل تقدر تتحكم بكل سماعة لحال، وطبعاً هاي الشاشة ربطناها مع الإنارة اللي ركبناها على هاي السيارة، الإنارة اللي ركبت على الأربع مكيفات، وركبت برضه عندك على السماعات. فإذا أنت حابب تعمل سيارتك نفس الشيء، زور معرض الدب إم، وأحكيلي أي قطعة اللي أعجبتك فيهم، ومنستناكم بالفرعين من الساعة 8 ولغاية الساعة 10 مساءً.\"\n\n---\n\n### ثانياً: الملخص الاستراتيجي للمحتوى\n\nهذا الفيديو هو **إعلان ترويجي مركّز لخدمات تعديل السيارات (تعديل تقني وجمالي)**، ويهدف إلى إبراز الجودة التقنية والجمالية للمنتجات. وتتلخص نقاط القوة في المحتوى فيما يلي:\n\n*   **التركيز على الميزات التقنية العالية:** استعرض الفيديو مواصفات الشاشة القوية (8 جيجا رام، مساحة 256 جيجا، ونظام DSP الصوتي)، مما يمنح المشاهد ثقة في جودة المنتج وتفوقه على الخيارات الأقل جودة.\n*   **التوافقية (Integration):** ركّز العارض على أن النظام الجديد يعمل بالتناغم الكامل مع نظام السيارة الأصلي، وهو الشاغل الأكبر لأي شخص يفكر في تعديل سيارته، مما يقلل من مخاوف العميل تجاه أي أعطال برمجية.\n*   **التسويق بالتجربة البصرية:** استخدام لقطات \"توضيحية حية\" لاستعراض الماوس والتحكم في الإنارة، يساهم في خلق تجربة شعورية للمشاهد تجعله يتخيل نفسه مكان السائق.\n*   **عنصر \"الكماليات المضافة\":** الربط بين الشاشة ونظام الإنارة المحيطة يعطي رسالة بأن المعرض يقدم \"حلولاً متكاملة\" وليس مجرد تركيب قطع منفصلة، مما يرفع من قيمة الخدمة المقدمة.\n*   **دعوة واضحة لاتخاذ إجراء (CTA):** انتهى الفيديو بد         "tr": "بصفتي خبيرًا في تحليل محتوى الفيديو، إليك التفريغ النصي والملخص الاستراتيجي للفيديو:\n\n### أولاً: التفريغ النصي للفيديو\n\n**[يبدأ الفيديو بلقطة قريبة تظهر شاباً يقوم بتركيب عداد رقمي جديد في سيارة BMW]**\n\n**الشاب:** \"هذا عداد، هذا عداد.. شوفوا، هذا العداد اللي ركبناه، شوفوا كيف، هذا العداد اللي ركبناه.. شوفوا.. عليه أكثر من مود، هذا الأول، وهذا الثاني، وهذا الثالث، وهذا الرابع. وشرط قبل التركيب فيش بفيش. فصفت عنا لأغلب أنواع السيارات عدادات ديجيتال، وكمان لأغلب أنواع السيارات طارات معدلة لكن لسا ما ركبنا له إياها، وبأفضل سعر على مستوى المملكة، وفيش بفيش. داخل محلات الربيع الفرع الرئيسي مقابل بنك صفوة بشارع المدينة الرياضية، وبتشرفونا بأي فرع بمدينة ومحطة اربد وحرية، لكن خلوا عينكم على الرئيسي بإدارة ثائر البحر.\"\n\n---\n\n### ثانياً: الملخص الاستراتيجي للفيديو\n\nيُعد هذا الفيديو نموذجاً ناجحاً لمحتوى \"ما قبل وما بعد\" (Before & After) الترويجي، ويهدف إلى استعراض خدمة تحديث إلكترونيات السيارات بأسلوب عملي. وتتلخص نقاط القوة الاستراتيجية في الآتي:\n\n*   **إبراز القيمة المضافة (Value Proposition):** ركز الفيديو على \"السهولة\" من خلال تأكيده المتكرر على عبارة \"فيش بفيش\" (Plug and Play)، مما يزيل حاجز الخوف لدى العميل من التعقيدات الفنية أو قص الأسلاك.\n*   **الدليل الاجتماعي والبصري:** استخدام لقطات قريبة توضح تغير واجهة العدادات من التقليدية إلى الديجيتال يخدم كإثبات قوي للجودة ويعزز الرغبة الشرائية لدى المتابع.\n*   **التسويق الموجه للعميل:** استعرض الفيديو تنوع الخيارات (أكثر من مود/نمط عرض)، مما يعطي انطباعاً بأن المنتج يمنح السيارة طابعاً عصرياً وشخصياً.\n*   **تحديد الهوية والانتشار الجغرافي:** تم تقديم معلومات واضحة حول موقع الفرع الرئيسي وفروع الشركة الأخرى (اربد، حرية، المدينة الرياضية)، مع تعزيز المصداقية بذكر اسم المدير المسؤول (ثائر البحر).\n*   **دعوة صريحة للعمل (Call to Action):** اختتم الفيديو بدعوة واضحة للعملاء بزيارة الفروع المحددة، مما يسهل عملية تحويل المشاهدة إلى زيارة واقعية.\n\n**الخلاصة:** الفيديو ناجح جداً في استهداف فئة مالكي سيارات BMW الباحثين عن \"تحديثات\" (Upgrades) لسياراتهم، حيث جمع بين الاحترافية الفنية والوض         "tr": "إليك تحليل محتوى الفيديو بناءً على طلبك:\n\n التفريغ النصي للفيديو:\n\n*   **00:00 - 00:04:** \"بسم الله، شوفوا يا جماعة، شوفوا الترتيب.\"\n*   **00:04 - 00:09:** \"شفتوا الأناقة؟ وشوفوا ترتيب إيد الباب، والسيارة الثانية BMW، ولسه تقريباً نص السيارات قاعدة بتركب ألياف ضوئية.\"\n*   **00:10 - 00:14:** \"على قيد التركيب، مرسيدس كمان ألياف ضوئية.\"\n*   **00:14 - 00:18:** \"وكمان على الفورد فوكس، شوفوا التركيب بسم الله ما شاء الله.\"\n*   **00:19 - 00:23:** \"وهنا كمان عندنا على الأيونيك برضه طقم ألياف أربع أبواب، وتابلو، وأرضيات، وكب هولدر، وإيد الباب.\"\n*   **00:24 - 00:28:** \"الحق حالك، بدلاً من 65 دينار فقط بـ 22 دينار.\"\n*   **00:28 - 00:32:** \"داخل محلات الربيع لكهرباء وزينة السيارات، بأي فرع مدينة، محطة، إربد، الحصن.\"\n*   **00:32 - 00:37:** \"اليوم بنحكي معاكم من الفرع الرئيسي بإدارة ثائر البحر، وبتشرفونا بأي فرع.. مدينة، محطة، إربد، أو الحصرية.\"\n\n---",

        "tr": "أهلاً بك. بصفتي خبيراً في تحليل المحتوى، يسعدني تقديم التحليل التالي للفيديو المرفق:\n\n### أولاً: التفريغ النصي للفيديو\n\n\"معلم، هذا الترند مطلوب، راح أفاجئك بسعره، هاي أدابتور (محول) راح يخرجلك تايب سي (Type-C) ويو إس بي (USB) وكمان آيفون، وعندك كمان مدخلين، واحد يو إس بي والثاني تايب سي، والحلو بالموضوع إن الأسلاك.. اطلع كيف، كل سهولة لحاله بيرجع.. معلم، 15 ليرة بتنباع، هيك هيك سعرها، وعند تيمو عاملين عليها أوفر بـ 7 ليرات و30 قرش، مزبوط؟ أنا هيك.. أنا متذكر الموضوع، اليوم الربيب بيحكيلك أقل من 6 دنانير، والكمية قد ما بدك وزيادة، يعني إذا بدك تاجر فيها على صفحات الأونلاين راح تستفيد كمان منها، حلو؟ كل أسبوعين له حبة، وما تحرجني، استني عن سعره والحقها، الحرية، محطة إربد شارع المدينة، موجود هذا الترند، لاين، بستناك، سلام.\"\n\n---\n\n### ثانياً: ملخص استراتيجي لمحتوى الفيديو\n\nيعتمد الفيديو أسلوب \"التسويق المباشر والمحفز\" لترويج إكسسوار سيارات (شاحن متعدد المنافذ)، ويمكن تلخيص استراتيجية المحتوى في النقاط التالية:\n\n*   **خلق الفضول والقيمة:** يبدأ صانع المحتوى بكلمات جاذبة (\"ترند\"، \"راح أفاجئك\") لضمان استمرارية المشاهدة، مع التركيز على \"حل المشكلة\" (تعدد المنافذ في جهاز واحد مع خاصية سلك قابل للسحب).\n*   **استراتيجية التسعير التنافسي:** يعمد المتحدث إلى المقارنة السريعة بين سعر السوق العادي (15 ليرة) وبين \"العرض\" المتاح لديهم (أقل من 6 دنانير)، مما يعطي انطباعاً فورياً بوجود صفقة رابحة.\n*   **استهداف شريحة التجار الصغار:** لم يكتفِ المروج باستهداف المستهلك النهائي، بل وجه دعوة صريحة للتجار لإعادة البيع، مما يوسع قاعدة المهتمين بالمنتج.\n*   **خلق \"الندرة\" و\"الاستعجال\":** استخدام عبارات مثل \"الكمية قد ما بدك\" و\"ما تحرجني\"، وربط المنتج بموقع محدد (محطة إربد)، يدفع المشاهد لاتخاذ إجراء سريع (زيارة المحل) قبل نفاد الكمية أو انتهاء العرض.\n*   **الأسلوب العفوي:** الاعتماد على اللهجة المحلية والأسلوب غير المتكلف يعزز من ثقة المشاهد في مصداقية العرض مقارنة بالإعلانات التقليدية الجامدة.",

        "tr": "أهلاً بك. بصفتي خبيراً في تحليل محتوى الفيديو، قمت بمراجعة المقطع بدقة. إليك التفريغ النصي والتحليل الاستراتيجي المطلوب:\n\n### أولاً: التفريغ النصي الكامل للفيديو\n\n\"أسرع وأقوى شاحن سيارة في الأردن. \nكان حقه 12 دينار، اليوم مش بـ 12، ولا بـ 10، ولا بـ 8، ولا بـ 7، ولا بـ 6؛ فقط بـ 5 دنانير! وانسى عجقة الأسلاك كاملة. \nفي حركة واحدة، بس زي هيك، بنضب السلك، ومعاك وصلة آيفون ووصلة Type-C. وإذا نوع تلفونك إشي ثاني معاك هون مدخل USB وType-C. \nحط كل هذا على جنب، قديش قوتها؟ 120 وات وفعلي! بسم الله ما شاء الله، وشوف الجمال، وانسى عِجقة الأسلاك وفقط على القداحة. \n5 دنانير! ويوجد لدينا خدمة توصيل لكافة أنحاء المملكة، والعرض طلع من الرئيسي بتوزع لكل أفرع المدينة: محطة، إربد، وحرية، وسلام عليكم.\"\n\n---\n\n### ثانياً: الملخص الاستراتيجي (تحليل المحتوى)\n\nيعتمد هذا الفيديو على استراتيجية \"التسويق بالإغراء السعري والمباشر\"، ويمكن تلخيص نقاط القوة فيه كالتالي:\n\n*   **خلق شعور بالاستعجال (Scarcity & Urgency):** استخدم المتحدث أسلوب \"التنازل السعري التدريجي\" (من 12 إلى 5 دنانير) لجعل العرض يبدو فرصة لا تعوض، وهو أسلوب نفسي فعال جداً لزيادة معدلات التحويل.\n*   **التركيز على حل \"نقطة ألم\" (Pain Point):** الميزة التنافسية التي ركز عليها الفيديو ليست مجرد شحن سريع، بل \"التخلص من فوضى الأسلاك\" في السيارة، وهو مشكلة يعاني منها أغلب السائقين.\n*   **استعراض عملي للمنتج (Product Demo):** الفيديو قصير ومركز، حيث قام بدمج \"التجربة العملية\" بـ \"الحديث التسويقي\" في وقت واحد، مما يرفع من ثقة المشاهد في جودة المنتج.\n*   **إبراز القيمة التقنية:** التركيز على رقم \"120 وات\" يعطي انطباعاً بالجودة العالية للمنتج، مما يجعله يبدو كـ \"صفقة رابحة\" للمستهلك عندما يقارنها بالسعر المنخفض (5 دنانير).\n*   **دعوة واضحة لاتخاذ إجراء (CTA):** ختم الفيديو بتوضيح وجود خدمة توصيل لكافة أنحاء المملكة، مع تحديد أماكن الفروع، مما يسهل على العميل اتخاذ قرار الشراء فوراً.\n\n**الخلاصة:** الفيديو نموذج مثالي للتسويق عبر \"ريلز\" أو \"تيك توك\"، حيث يتسم بالسرعة، البساطة، والتركيز على تقديم قيمة مادية محسوسة للمشاهد في أقل من 40 ثانية.",

    /* ===== بناء التبويبات والإحصائيات والبطاقات ===== */
    var competitors = [];
    var compMap = {};
    reportData.forEach(function(r) {
        if (!compMap[r.c]) { compMap[r.c] = 0; competitors.push(r.c); }
        compMap[r.c]++;
    });

    /* شريط الإحصائيات */
    document.getElementById('statsBar').innerHTML =
        '<span class="stat-chip">إجمالي السجلات: <strong>' + reportData.length + '</strong></span>' +
        '<span class="stat-chip">عدد المنافسين: <strong>' + competitors.length + '</strong></span>' +
        competitors.map(function(c) { return '<span class="stat-chip">' + c + ': <strong>' + compMap[c] + '</strong></span>'; }).join('');

    /* بناء التبويبات */
    var tabsHTML = '<button class="tab-btn active" onclick="openTab(event, \'all\')">الكل (' + reportData.length + ')</button>';
    competitors.forEach(function(c) {
        tabsHTML += '<button class="tab-btn" onclick="openTab(event, \'' + c.replace(/'/g, "\\'") + '\')">' + c + ' (' + compMap[c] + ')</button>';
    });
    document.getElementById('tabsContainer').innerHTML = tabsHTML;

    /* بناء محتوى التبويبات */
    function buildCards(filter) {
        var filtered = filter === 'all' ? reportData : reportData.filter(function(r) { return r.c === filter; });
        var html = '';
        filtered.forEach(function(r, idx) {
            var summaryHTML = '';
            if (r.s && r.s.trim() !== '' && r.s.trim() !== '*' && r.s.trim() !== 'تم التلخيص مدمجاً في التفريغ.') {
                summaryHTML = '<div class="block"><h3>الملخص الاستراتيجي</h3>' + md2html(r.s) + '</div>';
            } else if (r.s && r.s.trim() === 'تم التلخيص مدمجاً في التفريغ.') {
                summaryHTML = '<div class="block"><h3>الملخص الاستراتيجي</h3><p class="merged-note">الملخص مدمج ضمن التفريغ الصوتي أعلاه</p></div>';
            }

            html += '<div class="card" data-search="' +
                (r.t + ' ' + r.c + ' ' + r.tr + ' ' + r.s).replace(/"/g, '&quot;').toLowerCase() + '">' +
                '<div class="card-header"><span class="caption">' + r.t + '</span><span class="date">' + fmtDate(r.d) + '</span></div>' +
                '<div class="card-body">' +
                    '<div class="content">' +
                        '<div class="block transcript"><h3>التفريغ الصوتي</h3>' + md2html(r.tr) + '</div>' +
                        summaryHTML +
                    '</div>' +
                    '<div class="media">' +
                        (r.i && r.i !== '*' ? '<img src="' + r.i + '" alt="صورة المنشور" loading="lazy">' : '') +
                        (r.v ? '<a href="' + r.v + '" target="_blank" rel="noopener" class="watch-btn">مشاهدة الفيديو</a>' : '') +
                    '</div>' +
                '</div>' +
            '</div>';
        });
        return html;
    }

    /* إنشاء تبويب لكل منافس */
    var container = document.getElementById('reportContainer');
    container.innerHTML = '<div class="tab-content active" id="tab-all">' + buildCards('all') + '</div>';
    competitors.forEach(function(c) {
        var id = 'tab-' + c.replace(/[^a-zA-Z0-9\u0600-\u06FF]/g, '_');
        container.innerHTML += '<div class="tab-content" id="' + id + '">' + buildCards(c) + '</div>';
    });

    /* ===== وظائف التبويب والبحث ===== */
    function openTab(e, name) {
        document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
        document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
        e.currentTarget.classList.add('active');
        if (name === 'all') {
            document.getElementById('tab-all').classList.add('active');
        } else {
            var id = 'tab-' + name.replace(/[^a-zA-Z0-9\u0600-\u06FF]/g, '_');
            document.getElementById(id).classList.add('active');
        }
        searchReport();
    }

    function searchReport() {
        var q = document.getElementById('searchInput').value.toLowerCase().trim();
        var activeTab = document.querySelector('.tab-content.active');
        var cards = activeTab ? activeTab.querySelectorAll('.card') : [];
        var visible = 0;
        cards.forEach(function(card) {
            var text = card.getAttribute('data-search');
            if (!q || text.indexOf(q) !== -1) {
                card.style.display = '';
                visible++;
            } else {
                card.style.display = 'none';
            }
        });
        document.getElementById('noResults').style.display = (visible === 0) ? 'block' : 'none';
    }
