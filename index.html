            { c: "Double M For Cars Accessories", d: "25 يوليو 2026", t: "‏أرضيات تناسب جميع أنواع السيارات بعدت أشكال وألوان من شركة كريفا 😍✨", v: "https://www.facebook.com/reel/3067745800081097/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t51.71878-10/757346927_1066736229108443_3688773181190005224_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=100&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=3HIc2Hg0-ukQ7kNvwGZGVh6&_nc_oc=Adpc_TciAHcVoRLr00SVuOA6QJxVJbtwqNQFKPetyIVp2Vv4WYyJReThjdz3m1LqB1AhDp9Fug8FsK9q1wovfYof&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=OFMhpDDzC9ri4nmeeqhPVg&_nc_ss=7b289&oh=00_AQD9x-G2pc6_nr9sx3yRm4VyJeZm7Qkt0P3LEV_RuMt79w&oe=6A6B7D94", tr: "أهلاً شباب، اليوم جايب لكم أرضيات الكاريفا.. أرضيات لجميع أنواع السيارات، زي ما أنت شايف، شوفوا الأرضيات يا شباب، بتطلع في زوايا السيارة، ثبات جداً عالي، بتيجي مبزرة ومن تحت زي ما أنت شايف هي طبقة تشكشات، عشان تضلها ثابتة معك، وهي تبديلتها. بتركب على جميع أنواع السيارات، بتطلع عندي تشكيلة كاملة من الأرضيات، بدك معلم جلد لحال مع فورمايكا؟ بدك جلد مع قماش؟ بدك جلد لحال؟ بدك قماش لحال؟ كل الأشكال موجودة، سكني، بيج، أسود.. ايش ما بدك كله موجود في معرض الدبل إم. هذول الأرضيات أفضل أرضيات ممكن يركبوا على السيارات، ومستحيل سيارة في الأردن ما يركب عليها هذول الأرضيات، جميع السيارات بيركبوا عليها. فإذا كنت بتعاني من مشكلة أرضيات سيارتك، ما إلك إلا أرضيات الكاريفا. اسألني عنهم بالتعليقات، وقلي أي شكل عجبك فيهم بالتعليقات لأسودك بباقي التفاصيل، بنستناكم بالفرعين، سلام.", s: "<ul><li><strong>عرض المشكلة والحل:</strong> يبدأ الفيديو بمعالجة 'نقطة ألم' (Pain point) لدى السائقين، وهي عدم ثبات فرش السيارة (الأرضيات)، ويقدم المنتج كحل مثالي يتميز بالثبات العالي (بفضل طبقة 'التشكشات' المانعة للانزلاق).</li><li><strong>استراتيجية التنوع:</strong> يركز صانع المحتوى على عامل 'التخصيص' (Customization) من خلال استعراض تشكيلة واسعة من الألوان والخامات (جلد، قماش، فورمايكا، بيج، أسود، سكني)، مما يعطي المشاهد شعوراً بأن المنتج متاح ليناسب ذوقه الخاص ونوع سيارته.</li><li><strong>التأكيد على الشمولية:</strong> استخدم صانع المحتوى عبارة 'مستحيل سيارة في الأردن ما يركب عليها' لكسر حاجز التردد لدى المشاهد والتأكيد على عالمية القياس وتوافق المنتج مع جميع الطرازات.</li><li><strong>التفاعل كأداة تسويقية:</strong> يعتمد الفيديو استراتيجية 'التفاعل الموجه' (Call to Action)، حيث يطلب من المشاهدين التفاعل بالتعليقات ليس فقط لرفع وصول الفيديو (Algorithm optimization)، بل لفتح باب التواصل المباشر مع العميل (Lead Generation) لإرسال التفاصيل والأسعار.</li><li><strong>الخلفية التجارية (Social Proof):</strong> ربط المنتج بمعرض معروف ('معرض دبل إم') يعزز من مصداقية المنتج لدى المستهلك ويحفزه على زيارة الفروع.</li></ul>" },
            { c: "الربيع لكهرباء وزينة السيارات", d: "25 يوليو 2026", t: "فقط ب 9 دنانير منفاخ الجمل 🐪 الاصلي ‼️👏… #الــربيع_وجــهتك_الأولــى #الافضل_على_مستوى_المملكه", v: "https://www.facebook.com/reel/1624789312699038/", i: "https://scontent-lga3-1.xx.fbcdn.net/v/t15.5256-10/757563347_991896033681997_6092293891621165387_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=110&ccb=1-7&_nc_sid=1a6f08&_nc_ohc=b7QP1BY-LJ8Q7kNvwGlgx-B&_nc_oc=AdqIBkc6Qy6tb8KemLvhhBtrBoyTaO5NlRLwGo6VfBl9qVQ1N0On4qTL36OOVnEu7No&_nc_zt=23&_nc_ht=scontent-lga3-1.xx&_nc_gid=T0GMVhTlGscGn9BsW25T4w&_nc_ss=7b289&oh=00_AQDlrhsB8K9ZLJYWXgFzd9CqMP05zC8hV9Azd-P4x33qKQ&oe=6A6B1214", tr: "ومع التوالي يا عمي، هذا عرض الجنون، منفاخ السيارة الأصلي، الاثنين سلندر اللي لازم يكون موجود في كل سيارة، أبو الـ 18 دينار، داخل محلات الربيع، ولمّا نبيع بنفرجي.. هي المنفاخ، شوف بسم الله ما شاء الله، الأصلي ولا مش الأصلي؟ علم! والله غير الـ 9 دنانير، وفي كل أفرعنا: مدينة، ومحطة، وإربد، وحرية، والعرض طلع من الرئيسي مقابل بنك صفوة بإدارة 'تار البحر'، بتشرفونا بأي فرع من أفرعنا: مدينة، ومحطة، وإربد، وحرية.. سلامات.", s: "<ul><li><strong>خلق الإلحاح والقيمة (Value Proposition):</strong> استعرض المتحدث 'منفاخ سيارة بـ 2 سلندر' (منتج أساسي لكل سائق)، وقام بربطه مباشرة بخصم كبير (تخفيض السعر من 18 ديناراً إلى 9 دنانير)، مما يعطي المشاهد شعوراً فورياً بفرصة تفوت.</li><li><strong>بناء الثقة عبر التفاعل الحي:</strong> لم يكتفِ المتحدث بالكلام، بل أظهر المنتج من داخل الكرتونة، وركز على جودته ('الأصلي ولا مش الأصلي؟')، مما يعزز مصداقية المتجر أمام الزبون ويقلل التردد في الشراء.</li><li><strong>التسويق المكاني (Omnichannel):</strong> حرص المتحدث على تكرار أسماء الفروع (مدينة، محطة، إربد، حرية) أكثر من مرة، مما يضمن رسوخها في ذهن المشاهد وتسهيل الوصول لأقرب فرع له.</li><li><strong>أسلوب التقديم (الطاقة العالية):</strong> استخدام لغة حماسية سريعة الوتيرة يتناسب تماماً مع منصات 'الفيديو القصير' (Reels/TikTok)، مما يساعد في إيقاف المشاهد أثناء التصفح السريع ويحفز التفاعل.</li><li><strong>الخلاصة:</strong> الفيديو هو نموذج مثالي لـ 'إعلان العروض المباشرة' الذي يعتمد على مبدأ التسعير النفسي (خصم 50%) لزيادة حركة الزوار إلى الفروع الفعلية للمتجر.</li></ul>" },
            { c: "الربيع لكهرباء وزينة السيارات", d: "25 يوليو 2026", t: "افضل انواع الالياف الضوئيه بس ب 22 دينار ‼️ متخيلين جنون السعر 👏🔥… #الــربيع_وجــهتك_الأولــى #الافضل_على_مستوى_المملك...", v: "https://www.facebook.com/reel/2557246928045052/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t15.5256-10/756224506_2131433001136428_4124375069009417006_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=104&ccb=1-7&_nc_sid=1a6f08&_nc_ohc=koSSqMwPTCgQ7kNvwF8cmX5&_nc_oc=AdoW6-qXWsEbheDlBx_aYjQyudtKbyj5R_7yTpeCHJoHGTICl99hOXygA9aOEVw3YVD0Pf4_qztChkOeznVXqH3J&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=2-Aa7aLXkwpMv6-cFy7uTw&_nc_ss=7b289&oh=00_AQCTWgRewRgYW6qfppTqkFXy5DJEfa9VZRbAqIbJ42fJ9Q&oe=6A6B22C2", tr: "عذراً.. عذراً.. عذراً.. شره، 22 دينار، اليوم تم الحرق! فقط بـ 22 دينار، والنوعية اللي طلبتوها الـ (HQ) الأصلي الفول باكج. إيش هو؟ ألياف ضوئية.. أربعة أبواب وتابلو وأرضيات وكب هولدر، يعني بتضوي السيارة كامل على الأبليكيشن، شفت الإضاءة عالية بتوطيها، ما عجبك اللون بتغيره، بدك تحط شي متقطع بتحط.. يعني عالم وتغيير كامل للسيارة وتحت أيدي متخصصين بالتركيب. طبعاً يا إخوان فقط بـ 22 دينار، غير شامل أجور التركيب، لأنه السعر الأساسي 65 دينار. أهلاً وسهلاً بالجميع ويعطيكم ألف عافية، وأجور التركيب أجور رمزية جداً جداً صغيرة.. كل أفرعنا والفرع الرئيسي بدوار طارق، شارع مكة، بفرع مدينة المحطة.. إربد دوار حرية سلام.", s: "<ul><li><strong>خلق حالة من الاستعجال (Urgency):</strong> استخدام عبارة 'تم الحرق' يرسل إشارة للعميل بأن الفرصة محدودة زمنياً أو كمياً، مما يقلل من تفكيره المنطقي ويزيد من رغبته في الشراء.</li><li><strong>التأطير السعري (Price Anchoring):</strong> قام مقدم الفيديو بذكر السعر الأساسي (65 دينار) بجانب السعر المخفض (22 دينار)، مما يجعل العرض يبدو 'صفقة لا تفوت' في نظر المشاهد.</li><li><strong>إبراز القيمة (Value Proposition):</strong> ركز العرض على شمولية المنتج (ألياف، تابلو، أبواب، تطبيق تحكم) لتبرير الفائدة التي سيحصل عليها العميل مقابل المبلغ المدفوع.</li><li><strong>تقديم الحلول لا المنتجات:</strong> الفيديو لم يبع مجرد 'أسلاك إضاءة'، بل باع 'تجربة تغيير كاملة للسيارة'، مع توفير خدمة التركيب الاحترافي، وهو ما يزيل عن العميل عناء البحث عن فنيين.</li><li><strong>دعوة واضحة لاتخاذ إجراء (Call to Action):</strong> اختتم الفيديو بتحديد مواقع الفروع بشكل دقيق وودود، مما يسهل على العميل الوصول للخدمة فوراً بعد الاقتناع بالعرض.</li><li><strong>نصيحة إضافية:</strong> الفيديو فعال جداً في منصات مثل 'تيك توك' أو 'ريلز'؛ لأنه يعتمد على الإيقاع السريع والطاقة العالية، مما يضمن الحفاظ على معدل مشاهدة مرتفع للنهاية.</li></ul>" },
            { c: "الربيع لكهرباء وزينة السيارات", d: "25 يوليو 2026", t: "خيارك الأفضلSR❤️🚗 اهلا وسهلا نورتونا وهيك الزبون اخد افضل نسبة عزل 99.8 شفاف وغير مخالف متوفر فقط داخل محلات الر...", v: "https://www.facebook.com/reel/914210917708233/", i: "https://scontent-lhr11-1.xx.fbcdn.net/v/t15.5256-10/758252758_1540518764179878_7332178257248884275_n.jpg?_nc_cat=111&ccb=1-7&_nc_sid=1a6f08&_nc_ohc=RJyRzFTZf-sQ7kNvwHwoNo6&_nc_oc=AdqWvetTBSMl4GilXf8M73c9fe_rYizsYd2j-SfLoZC4Qz-YEVx_j5lyPw5LvJ7PA-o&_nc_zt=23&_nc_ht=scontent-lhr11-1.xx&_nc_gid=FEod9fxZSWZCYTmxX2pDwQ&_nc_ss=7b289&oh=00_AQABW5E1YzkxUhDbgNsB3cr7Yzrga_4Sj1s0PMQM2MsP4w&oe=6A6B7B5A", tr: "أجينا... الربيع للزينة. جبنا... التظليل الألترا (Ultra). بعزل 99.8. شفاف... ومخالفة ما في. بترخص... ع كفالتي. الالترا شيلد... يلا شوف. يا فتات... ما شاء الله. نحنا موجودين في فرع... ضاحية اكس فور. وبنستقبلكم في جميع فروعنا، سلام.", s: "<ul><li><strong>استخدام عنصر 'طفل' كواجهة إعلانية:</strong> الاعتماد على طفلة في تقديم المنتج يعزز من مصداقية الفيديو ويزيد من معدلات التفاعل (Engagement) والمشاركة، حيث يضفي نوعاً من البراءة واللطافة التي تجذب المشاهد وتجعله يتابع الفيديو حتى النهاية.</li><li><strong>معالجة 'نقاط الألم' (Pain Points) للعميل:</strong> ركز الفيديو بذكاء على أكبر مخاوف أصحاب السيارات عند تركيب التظليل، وهي: القانونية (التأكيد على أن التظليل 'شفاف' و'ما في مخالفة')، والفائدة العملية (التركيز على نسبة العزل العالية (99.8%) للحماية من حرارة الشمس)، والضمان (استخدام عبارة 'على كفالتي' لتعزيز الثقة في جودة المنتج).</li><li><strong>تحديد الهوية والانتشار:</strong> الفيديو يوضح العلامة التجارية ('الربيع للزينة') ويشير إلى وجود فروع متعددة، مع تحديد موقع فرع معين (ضاحية اكس فور)، مما يسهل على العميل معرفة وجهته.</li><li><strong>الخاتمة الدعائية:</strong> ينتهي الفيديو بدعوة لاتخاذ إجراء (Call to Action) واضحة ومرحبة، مما يحول المشاهد من متفرج إلى عميل محتمل يزور الفروع.</li><li><strong>التقييم العام:</strong> الفيديو إعلاني قصير وفعال جداً، يبتعد عن التعقيد التقني ويركز على الفوائد المباشرة للمستهلك بطريقة عفوية وسلسة.</li></ul>" },
            { c: "Double M For Cars Accessories", d: "25 يوليو 2026", t: "حتى تركيب الشاشات بالدبل ام غير🫡😎🚗", v: "https://www.facebook.com/reel/1935602917151538/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t51.82787-10/754224324_18360482071215801_6724234420483179282_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=108&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=ax-jRQ96y-YQ7kNvwHS99XG&_nc_oc=Adq-dfYrARHPi-LThLMSUpZif2Sua9KyRT01htW_fDfkS_aB3bsEeQTndhj9KjHXYyf6zPhA1QjCPVeyz4XXYjYn&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=LIHj2x9O9_Gj4XHiYMzAeA&_nc_ss=7b289&oh=00_AQD426Ybr7RTJLdALyA_OmClh8ZGSKnGdfizgXqFkDB5Dw&oe=6A6BA139", tr: "وبالنسبة للكامبسات، شو هو الكامبس؟ هو معرف الداتا تبع سيارتك، يعني مثلاً، معرف تحكم الطارة، طلعك معي كيف.. أتحكم لك بالشاشة عن طريق الطارة، بالإضافي كمان زي ما إحنا شايفين كيف المكيف، اشتغل أصلي مية بالمية.. يجيلها دبل كامبس، فركبنا الدبل كامبس الأصلي والمخصص بحسب نوعيتها.. والحلو بالموضوع، هاي الشاشة ركبناها على هاي النيرو. أنا ليش ما صورتلك إياها وهي مجموعة عشان بس أورجيك الكامبس وعشان أورجيك الفيش.. الفيش زي ما إحنا شايفين.. بسم الله ما شاء الله. وأحلى ميزة بهاي الشاشة، انسى إنه موجود فيها ألياف ضوئية، بس فيها حمالة تليفون، يعني بعد هيك وداعاً للمخالفات حرفياً، مستحيل إنك تتخالف بسيارتك. هاي الشاشة بتيجي 4 بـ 64 جيجا مساحة تخزين، والحلو بالموضوع كمان أبل كار بلاي وأندرويد أوتو. لو إنت مهتم تركب هاي الشاشة على الكامبسات الأصلية وفيش في فيش وعلى الفريم الأصلي، بس زورني بالـ 'دبليو إم'، سواء دوار الحويان أو الحرية، موفرلك أفخم الشاشات على مستوى المملكة، واليوم السبت إحنا بنحكي معكم من فرع الحرية، أهلاً وسهلاً فيكم وتشرفونا بالفرعين.", s: "<ul><li><strong>التخصص والاحترافية:</strong> التركيز على أن الشاشات المعروضة ليست مجرد شاشات ترفيهية عامة، بل هي أنظمة 'مخصصة' (Customized) تعمل بتناغم تام مع كمبيوتر السيارة (Canbus)، مما يضمن عدم حدوث أي تضارب تقني.</li><li><strong>التكامل الوظيفي (Plug & Play):</strong> إبراز ميزة التوافق الكامل مع خصائص السيارة الأصلية (التحكم بالمقود، نظام التكييف) دون الحاجة لقص الأسلاك أو تغيير الفريم الأصلي، مما يحافظ على قيمة السيارة.</li><li><strong>تلبية الاحتياجات القانونية والعملية:</strong> تسويق الشاشة ليس فقط كجهاز ترفيهي، بل كحل استباقي لمشكلة 'مخالفات الهاتف'، عبر دمج حامل الهاتف وميزات الاتصال المتطور (أبل كار بلاي وأندرويد أوتو).</li><li><strong>بناء الثقة:</strong> عرض 'ما خلف الكواليس' (الأسلاك والفيش الأصلية) يعزز من مصداقية مقدم الخدمة أمام المشاهد، ويظهر الفارق بين التركيب الاحترافي والتركيب العشوائي.</li><li><strong>دعوة صريحة للعمل (Call to Action):</strong> توجيه واضح للجمهور الجغرافي المستهدف بزيارة الفروع (دوار الحويان أو الحرية)، مع تعزيز الموثوقية بالادعاء بامتلاك 'أفخم الشاشات على مستوى المملكة'.</li><li><strong>الخلاصة:</strong> الفيديو هو نموذج ناجح لتسويق الخدمات التقنية عبر 'إظهار الفائدة لا المواصفات فقط'، حيث حوّل ميزة تقنية معقدة (الكامبس) إلى ميزة بيعية واضحة (التحكم الأصلي وتجنب المخالفات).</li></ul>" },
            { c: "الربيع لكهرباء وزينة السيارات", d: "25 يوليو 2026", t: "منفاخ + عده كامله فقط ب 10 دنانير 🔥👏… #الــربيع_وجــهتك_الأولــى #الافضل_على_مستوى_المملكه", v: "https://www.facebook.com/reel/1803691680795341/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t15.5256-10/757417155_1871587220464988_5722080298681722748_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=105&ccb=1-7&_nc_sid=1a6f08&_nc_ohc=6VTKnLbHsmIQ7kNvwHS9A1K&_nc_oc=Adqdv5SjZrN6SSJrVZXKUR9mpAJGfqySPmkFKhCvl9nCe2N59Q6-tprnouMYI5_lXN2eVzihABBANHl_WpUDKYBi&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=PUfwvIutcu4FU0aDfWd2oA&_nc_ss=7b289&oh=00_AQBhCDuSoWw1gq4hjl5F4AkYq3IPmpY8_h95PBERAH7Vnw&oe=6A6B9131", tr: "يا أخي هذا قديش سعره؟ ولا عاجبني سعره، ولا عاجبني بعشرين، ولا عاجبني بسبعتاشر، ولا عاجبني بستاشر، ولا عاجبني بخمستاشر، ولا بأربعتاشر، ولا بطلطاشر، ولا بطلناشر، ولا بأحدعش... فقط بـ 10 دنانير من فاخر الهامر مع العدة، طبعاً مع بربيج الحلزوني. بسم الله ما شاء الله، 2 سلندر أصلي، عدة بنشر كاملة، زرادية، قطاعة، زي ما أنتم شايفين. والحقوا العرض لفترة محدودة، أهلاً وسهلاً بالجميع وسلامات.", s: "<ul><li><strong>استراتيجية 'كسر السعر' (Price Anchoring):</strong> استخدم المُعلِن أسلوباً تكرارياً في نفي القبول بأسعار عالية (بدءاً من 20 ديناراً نزولاً إلى 11 ديناراً)، لخلق حالة من الترقب والإيحاء للمشاهد بأن السعر النهائي هو 'صفقة لا تفوت'.</li><li><strong>خلق الإلحاح (Urgency):</strong> تعمد استخدام جملة 'لفترة محدودة' في نهاية الفيديو لتحفيز المشاهد على اتخاذ قرار الشراء فوراً وعدم التأجيل.</li><li><strong>استعراض القيمة مقابل السعر:</strong> ركز الفيديو على إبراز محتويات حقيبة العدة (2 سلندر، عدة بنشر متكاملة، أدوات يدوية) لتعزيز قيمة المنتج وإقناع المشاهد بأن 10 دنانير سعر زهيد جداً مقارنة بما سيحصل عليه.</li><li><strong>الأسلوب التفاعلي:</strong> يعتمد الفيديو على لغة جسد نشطة ونبرة صوت حماسية وسريعة، وهي تقنية فعالة لجذب انتباه المشاهد في الثواني الأولى من فيديوهات منصات التواصل الاجتماعي (مثل Reels أو TikTok).</li></ul>" },
            { c: "Double M For Cars Accessories", d: "25 يوليو 2026", t: "كيف راح نحمي سيارتك مع ال puff ✨️🚗", v: "https://www.facebook.com/reel/1047497524801831/", i: "https://scontent-iad6-1.xx.fbcdn.net/v/t51.71878-10/755870416_3547414388761502_9108316359017128158_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=106&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=8O6b3DQIf0YQ7kNvwGLuDp4&_nc_oc=AdpoW9mHReTp8jvMCWoiqXclTgDQ4HkTXv9CRaYAjIOeoGlOkPSeIxuF_epPsdBbgYw&_nc_zt=23&_nc_ht=scontent-iad6-1.xx&_nc_gid=zVj5waqjdVRC5-KHdJ2Pcg&_nc_ss=7b289&oh=00_AQChuL9pvgZYS64IbWsciSFGU_u88kE_SDRv9wF0Gad3RQ&oe=6A6B9E1C", tr: "هذه السيارة قررنا نحمي إضاءتها بطبقة حماية واللي هي الـ PPF، واللي راح تحمي لك الإضاءة الأمامية أو الخلفية من البهتان أو أي خدوش أو أي اصفرار. وهيك خلصنا الإضاءة، أنتوا شايفين حرفياً مش مبين عليها ولا أي إشي، وغير هيك متوفر منها على طبقة أعتم، إذا حاب أنك تركبها على طبقة أعتم تعدل من الضوء اللي عندك برضو بإمكانك. وهيك السيارة بتكون جاهزة ومحمية من عند الإضاءة الأمامية، وإذا أنت حاب تحمي سيارتك سواء أجزاء من السيارة أو الإضاءة، متوفرة هذه الخدمة عندنا بالدبل، أم الفرعين؛ مقابل دول الحويان أو مقابل حرية مول، اكتبوا لي (Bf) بالتعليقات ليصلك عنها كامل التفاصيل.", s: "<ul><li><strong>القيمة المقترحة (Value Proposition):</strong> ركز الفيديو على حل مشكلة ملموسة وهي 'تلف الإضاءة الأمامية' (البهتان، الخدوش، الاصفرار)، وقدم حلاً وقائياً فعالاً وهو 'طبقة حماية PPF'، مع توضيح ميزة تنافسية إضافية وهي 'خيار التعتيم' (تعديل الشكل الجمالي).</li><li><strong>عنصر 'اللامرئية' (Transparency Selling):</strong> استخدم الفيديو اللقطات القريبة (Close-ups) ليؤكد أن طبقة الحماية غير مرئية تماماً، مما يزيل التخوف لدى العميل من أن الحماية قد تؤثر على مظهر السيارة.</li><li><strong>استراتيجية الدعوة لاتخاذ إجراء (Call to Action - CTA):</strong> اعتمد الفيديو على استراتيجية 'الكلمة المفتاحية في التعليقات' (اكتب BF للحصول على التفاصيل). هذه الاستراتيجية ذكية جداً لأنها: تزيد من التفاعل (Engagement) على المنصة، مما يحسن من خوارزميات الفيديو. تسهل عملية الرد المباشر على المهتمين وتحويلهم إلى 'عملاء محتملين' (Leads) في الرسائل الخاصة.</li><li><strong>تحديد المواقع (Geotargeting):</strong> ختم الفيديو بتحديد مواقع الفروع بشكل واضح (مقابل دول الحويان/حرية مول)، مما يعطي مصداقية للمشاهد بأنها خدمة حقيقية ومتاحة في نطاقه الجغرافي.</li><li><strong>الخلاصة:</strong> الفيديو ناجح تسويقياً لأنه دمج بين إظهار جودة الخدمة (قبل وبعد) وبين تقنية تفاعلية لزيادة الوصول والمبيعات.</li></ul>" },
            { c: "الربيع لكهرباء وزينة السيارات", d: "25 يوليو 2026", t: "🚨 أقوى خصم في تاريخ الربيع! 🚨 🔥 خصم 50% على أفضل وأحدث أنواع الليزرات. لا تفوّت الفرصة… العرض الأقوى لفترة محدودة فقط...", v: "https://www.facebook.com/reel/1761894341485340/", i: "https://scontent-ams2-1.xx.fbcdn.net/v/t15.5256-10/755945365_1319078143642387_3942500050238293187_n.jpg?stp=dst-jpg_p565x565_tt6&_nc_cat=100&ccb=1-7&_nc_sid=3a9e82&_nc_ohc=TqWfw2CL4zUQ7kNvwE-FKRl&_nc_oc=AdpsZY1YWigiK34vwTm3h3isQ9EqM04L-XqbKOp5XU1SLEPF0XYRh6D85u0O1Ni6IjduWYMLQ3q_0wPL451uIwMn&_nc_zt=23&_nc_ht=scontent-ams2-1.xx&_nc_gid=7REnN0rIRHhE5A4aTZchvQ&_nc_ss=7b289&oh=00_AQCtiTXr_kgvRPKJYknwbTZz-ExZnfnuqpdxhmNCiDtS0A&oe=6A6B8580", tr: "يا عيني، يا عيني، يا عيني، يا عيني، يا عيني، وأهم شيء ركز معاي، ومعانا اليوم الـ SR70 برو، اللي من منتجات شركة الربيع، اللي عليه كفالة خطية لمدة سنتين، على إنه يضل شغال معك 24 ساعة، ونفس المدى اللي رح يعطيك إياه 300 متر، ونفس خط العيار كمان على الداخلي، وأثبت وجوده، وعلى العالي كمان، وكفالة خطية لمدة سنتين على أقوى سعر وأكثر طلب من عند محلات الربيع لزينة السيارات. تعرف ليش؟ لأنه ما بيؤذي اللي قبالك، كفالة كثير قوية، وسعر جداً بسيط حالياً عند محلات الربيع لزينة السيارات، والخصم لمدة أسبوع، تعالوا الحقوا عالي وواطي كشافات، واهوا النجم من ورا صفراء، لـ إنارة البيضاء، إضاءة كثير قوية، الحق هذا الخصم، الربيع محطة اربد شارع المدينة، راح تلاقيه موجود وبستناك، سلام.", s: "<ul><li><strong>إبراز القيمة التنافسية:</strong> يتم التركيز على 'الطول والمدى' (300 متر) مع الحفاظ على 'خط العيار' الصحيح، مما يوحي بالدقة والجودة العالية.</li><li><strong>بناء الثقة (الضمان):</strong> استخدام 'الكفالة الخطية لمدة سنتين' كأداة قوية لإزالة مخاوف العميل من جودة المنتج.</li><li><strong>خلق ميزة اجتماعية وأخلاقية:</strong> التركيز على أن الإضاءة 'لا تؤذي السائقين في الجهة المقابلة'، مما يعطي انطباعاً بأن المنتج مدروس تقنياً ومسؤول.</li><li><strong>خلق إلحاح شرائي (Urgency):</strong> ربط العرض بـ 'أكثر طلب' و'خصم لمدة أسبوع'، مما يحفز العميل على اتخاذ قرار الشراء الفوري.</li><li><strong>الوضوح الجغرافي:</strong> تحديد مكان المتجر بدقة (الربيع، محطة اربد، شارع المدينة) لتسهيل الوصول للمنتج.</li><li><strong>الاستهداف البصري:</strong> الربط بين الجودة العالية (الإضاءة البيضاء) والسعر 'جداً بسيط'، وهو مزيج تسويقي جذاب جداً في قطاع زينة السيارات.</li><li><strong>الخلاصة:</strong> الفيديو ناجح في استهداف أصحاب السيارات الذين يبحثون عن تطوير إضاءة مركباتهم مع ضمان طويل الأمد وسعر تنافسي، معتمداً على لغة بسيطة وعفوية قريبة من العميل.</li></ul>" },

        function generateReport() {
            const container = document.getElementById('reportContainer');
            const tabsContainer = document.getElementById('tabsContainer');
            const competitors = {};
            
            // تجميع البيانات حسب المنافس
            reportData.forEach(item => {
                if (!competitors[item.c]) {
                    competitors[item.c] = [];
                }
                competitors[item.c].push(item);
            });

            let compIndex = 0;
            const compMap = {};
            
            // إنشاء التبويبات
            Object.keys(competitors).forEach(comp => {
                compIndex++;
                const safeId = `tab_${compIndex}`;
                compMap[comp] = safeId;
                
                const btn = document.createElement('button');
                btn.className = 'tab-btn';
                btn.innerText = comp;
                btn.setAttribute('onclick', `openTab(event, '${safeId}')`);
                tabsContainer.appendChild(btn);
            });

            // إنشاء المحتوى
            let html = '';
            Object.keys(competitors).forEach(comp => {
                const safeId = compMap[comp];
                html += `<div id="${safeId}" class="tab-content">`;
                html += `<div class="competitor-header"><h2>${comp}</h2><span class="badge">${competitors[comp].length} منشور</span></div>`;
                
                competitors[comp].forEach(item => {
                    html += `
                    <div class="card">
                        <div class="card-header">
                            <span class="caption">${item.t}</span>
                            <span class="date">${item.d}</span>
                        </div>
                        <div class="card-body">
                            <div class="media">
                                <img src="${item.i}" alt="Post Image" onerror="this.style.display='none'">
                                <a href="${item.v}" target="_blank" class="watch-btn">مشاهدة الفيديو</a>
                            </div>
                            <div class="content">
                                <div class="block transcript">
                                    <h3>🎙️ التفريغ الصوتي</h3>
                                    <p>${item.tr || 'لا يوجد محتوى صوتي.'}</p>
                                </div>
                                <div class="block">
                                    <h3>📊 الملخص الاستراتيجي</h3>
                                    ${item.s || '<p>لا يوجد ملخص متاح.</p>'}
                                </div>
                            </div>
                        </div>
                    </div>`;
                });
                
                html += `</div>`;
            });
            
            container.innerHTML = html;
        }

        function openTab(evt, tabName) {
            const tabcontent = document.getElementsByClassName('tab-content');
            for (let i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            const tablinks = document.getElementsByClassName('tab-btn');
            for (let i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            
            if (tabName === 'all') {
                // إظهار الكل
                for (let i = 0; i < tabcontent.length; i++) {
                    tabcontent[i].style.display = "block";
                }
            } else {
                document.getElementById(tabName).style.display = "block";
            }
            evt.currentTarget.className += " active";
            
            // إعادة ضبط البحث
            document.getElementById('searchInput').value = '';
            searchReport();
        }

        function searchReport() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const cards = document.getElementsByClassName('card');
            let visibleCount = 0;

            for (let i = 0; i < cards.length; i++) {
                const cardText = cards[i].innerText.toLowerCase();
                if (cardText.includes(searchTerm)) {
                    cards[i].style.display = '';
                    visibleCount++;
                } else {
                    cards[i].style.display = 'none';
                }
            }

            const noResults = document.getElementById('noResults');
            if (visibleCount === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
            }
        }

        generateReport();
    </script>
